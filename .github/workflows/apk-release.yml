# APK Release — builds the Android APK and publishes it as a downloadable artifact.
#
# Runs on:
#   - a version tag (vX.Y.Z) -> creates/updates a GitHub Release with the APK
#   - workflow_dispatch        -> builds and uploads the APK to object storage
#     (Cloudflare R2 / AWS S3) if those secrets are configured
#
# Why GitHub Releases for the APK: a 100MB+ APK exceeds Cloudflare's free 25MB
# asset limit, but GitHub Releases have no practical size limit and serve a
# stable "latest" download URL for free. R2 objects can exceed 25MB too, but
# the Cloudflare Pages free 25MB asset cap does NOT apply to R2.
#
# After this runs, set the web env var on Vercel/Render:
#   NEXT_PUBLIC_APK_URL=<release download url>  (or the R2/S3 URL if used)

name: APK Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      # GitHub Releases upload needs the APK as a file in the workspace. EAS
      # builds on a remote server, so for the release artifact we do a LOCAL
      # gradle build (assembleRelease) which outputs the APK into the repo.
      - name: Local Android release build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew :app:assembleRelease
          cd ..

      - name: Locate APK
        id: apk
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          echo "APK=$apk"
          echo "apk_path=$apk" >> "$GITHUB_OUTPUT"

      # Upload the APK to GitHub Releases (works for files > 100MB).
      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.apk.outputs.apk_path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.apk_path }}
          generate_release_notes: true

      # Optional: upload to object storage (Cloudflare R2 / AWS S3) via the S3
      # API. R2 supports objects larger than 25MB.
      - name: Upload APK to R2/S3
        if: steps.apk.outputs.apk_path != '' && env.R2_ACCESS_KEY_ID != ''
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_ENDPOINT_URL="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          aws --version || pip install awscli 2>/dev/null || true
          aws s3 cp "${{ steps.apk.outputs.apk_path }}" "s3://$R2_BUCKET/nuvora-app.apk" --endpoint-url "$AWS_ENDPOINT_URL" || echo "R2 upload failed/skipped"

      # Publish OTA update so installed apps get this build's JS (no reinstall).
      - name: Publish OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx eas-cli update --channel preview --message "Release ${{ github.ref_name }}" --non-interactive || echo "OTA update skipped"
