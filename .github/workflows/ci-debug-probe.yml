# TEMPORARY diagnostic workflow — NOT part of CI. It reports `gofmt -l` and
# `go test ./...` failures as check-run annotations so they are readable via
# the GitHub API. Delete this file before the PR is finalized.
name: "CI debug probe (temporary)"

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    name: Probe gofmt + go test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Probe gofmt
        run: |
          set +e
          enc() { python3 -c 'import sys;print(sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'; }
          echo "::notice title=toolchain::$(go version | enc)"
          OUT=$(gofmt -l internal cmd pkg)
          if [ -z "$OUT" ]; then
            echo "::notice title=gofmt-l::CLEAN"
          else
            echo "::warning title=gofmt-l::$(printf '%s' "$OUT" | enc)"
            i=0
            for f in $OUT; do
              i=$((i+1))
              if [ "$i" -le 6 ]; then
                DIFF=$(gofmt -d "$f" | head -c 1500)
                echo "::warning title=gofmt-diff-$i::$(printf '%s' "$DIFF" | enc)"
              fi
            done
          fi

      - name: Probe go test
        env:
          REDIS_URL: redis://localhost:6379/0
        run: |
          set +e
          enc() { python3 -c 'import sys;print(sys.stdin.read().replace("%","%25").replace("\r","%0D").replace("\n","%0A"))'; }
          go test ./... > test-out.txt 2>&1
          CODE=$?
          echo "::notice title=go-test-exit::code=${CODE}"
          if [ "$CODE" -eq 0 ]; then
            echo "::notice title=go-test::ALL TESTS PASSED"
            exit 0
          fi
          SUM=$(grep -E "^(--- FAIL|FAIL|panic|--- SKIP)" test-out.txt | head -60)
          echo "::error title=test-summary::$(printf '%s' "$SUM" | enc)"
          i=0
          grep -n "^--- FAIL" test-out.txt | head -8 | while IFS= read -r hit; do
            ln=${hit%%:*}
            i=$((i+1))
            BODY=$(sed -n "${ln},$((ln + 12))p" test-out.txt | head -c 1400)
            echo "::error title=fail-block-$i::$(printf '%s' "$BODY" | enc)"
          done
          PKG=$(grep -E "^(FAIL|panic|\?)" test-out.txt | grep -v "^ok" | head -30)
          if [ -n "$PKG" ]; then
            echo "::error title=pkg-status::$(printf '%s' "$PKG" | enc)"
          fi
