name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  backend:
    name: Go — build, vet, test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Lint (gofmt + vet)
        run: |
          test -z "$(gofmt -l internal cmd pkg)" || (gofmt -l internal cmd pkg; exit 1)
          go vet ./...
      - name: Test (root module — Redis integration included)
        env:
          REDIS_URL: redis://localhost:6379/0
        run: go test ./...
      - name: Test (legacy module)
        working-directory: legacy/server
        run: go test ./...

  prompt-evals:
    name: Prompt evals (chat rubric)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run CI eval suite (deterministic rubric)
        run: go test ./internal/service/ -run 'TestChatPromptEvals_CI|TestChatService_|TestPushService_' -v
      - name: Live evals against Gemini (when key provided)
        if: env.GEMINI_API_KEY != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: go test ./internal/service/ -run 'TestChatPromptEvals_Live' -v

  e2e-pg:
    name: E2E — real PostgreSQL (scripts/e2e-pg.sh)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nuvora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install postgres client (psql/pg_dump)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run full E2E against real Postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/nuvora?sslmode=disable
        run: bash scripts/e2e-pg.sh 8099

  frontend:
    name: Web — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test        # Vitest — session-authz regression suite (G1)
      - run: npm audit --audit-level=high   # dependency gate (G2)
      - run: npm run build

  lighthouse:
    name: Lighthouse CI — Perf/SEO/A11y gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install LHCI
        run: npm install -g @lhci/cli@0.14.x
      # All three processes must run inside ONE step — GitHub Actions kills
      # background processes when the step shell exits.
      - name: Boot API + web, run Lighthouse
        working-directory: client
        run: |
          set -e
          # Pre-build the API binary so the health window isn't racing a
          # cold `go run` compile.
          (cd .. && go build -o /tmp/nuvora-api ./cmd/api)
          (PORT=8080 /tmp/nuvora-api > /tmp/api.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -m 1 localhost:8080/health >/dev/null 2>&1 && break; sleep 1; done
          curl -sf -m 1 localhost:8080/health >/dev/null || { echo "API failed"; tail -20 /tmp/api.log; exit 1; }
          npm run build
          SERVER_JS=.next/standalone/server.js
          [ -f "$SERVER_JS" ] || SERVER_JS=.next/standalone/client/server.js
          mkdir -p "$(dirname "$SERVER_JS")/.next"
          cp -r .next/static "$(dirname "$SERVER_JS")/.next/static"
          API_PROXY_TARGET=http://localhost:8080 PORT=3000 HOSTNAME=0.0.0.0 node "$SERVER_JS" > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -m 1 localhost:3000/ >/dev/null 2>&1 && break; sleep 1; done
          curl -sf -m 1 localhost:3000/ >/dev/null || { echo "web failed"; tail -20 /tmp/web.log; exit 1; }
          # lhci must be on PATH in THIS step: install here and export the
          # npm prefix (global installs from earlier steps aren't reliably
          # on PATH after the Node 20→24 runner migration).
          npm install -g @lhci/cli@0.14.x >/dev/null 2>&1 || true
          export PATH="$(npm config get prefix)/bin:$PATH"
          if command -v lhci >/dev/null 2>&1; then
            lhci autorun --config=../lighthouserc.json
          else
            npx --yes @lhci/cli@0.14.x autorun --config=../lighthouserc.json
          fi

  drill:
    name: DR drill — backup → restore → verify (real PostgreSQL, G3.4)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nuvora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install postgres client (psql/pg_dump/pg_restore)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migrate + seed deterministic rows
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/nuvora?sslmode=disable
        run: |
          go run ./cmd/migrate --cmd=up
          psql "$DATABASE_URL" -f scripts/seed-refs.sql
      - name: Backup → automated restore drill (deep checksums)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/nuvora?sslmode=disable
          BACKUP_MAX_AGE_HOURS: "1"
        run: |
          BACKUP_RETENTION_DAYS=1 bash scripts/backup.sh
          bash scripts/dr-drill.sh --deep

  observability:
    name: Metrics + alerts config validation (G3.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Metrics unit tests (telemetry + queue instrumentation)
        run: go test ./internal/telemetry/ ./internal/worker/
      - name: Validate Prometheus config + alert rules (promtool)
        run: |
          # Mount at /etc/prometheus: prometheus.yml references its rules at
          # /etc/prometheus/alerts.yml (the path the compose service uses).
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v2.53.0 \
            promtool check config /etc/prometheus/prometheus.yml
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v2.53.0 \
            promtool check rules /etc/prometheus/alerts.yml
      - name: Validate Grafana dashboard JSON
        run: python3 -m json.tool deploy/grafana/dashboards/nuvora-api.json > /dev/null
      - name: Validate production compose stack
        env:
          POSTGRES_PASSWORD: ci-check
          GRAFANA_ADMIN_PASSWORD: ci-check
          SITE_URL: https://nuvora.com
          ALLOWED_ORIGINS: https://nuvora.com
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Metrics endpoint smoke (API boots + scrape responds)
        env:
          PORT: "8080"
        run: |
          go build -o /tmp/nuvora-api ./cmd/api
          (PORT=8080 /tmp/nuvora-api > /tmp/api.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf -m 1 localhost:8080/health >/dev/null 2>&1 && break; sleep 1; done
          curl -sf localhost:8080/metrics | grep -q 'nuvora_build_info' || { echo "metrics scrape missing build info"; tail -20 /tmp/api.log; exit 1; }
          curl -s localhost:8080/health > /dev/null
          curl -sf localhost:8080/metrics | grep -q 'nuvora_http_requests_total' || { echo "metrics scrape missing http counters"; exit 1; }
          echo "metrics smoke OK"

  contract:
    name: OpenAPI contract coverage (G6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./internal/transport/http/ -run TestOpenAPIContract -v

  browser-e2e:
    name: Browser E2E — Playwright + axe (G6)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nuvora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install Playwright chromium
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E (real Postgres + standalone web)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/nuvora?sslmode=disable
          WEBHOOK_SECRET: e2e-browser-secret
        run: bash scripts/e2e-web.sh
