name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  backend:
    name: Go — build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Lint (gofmt + vet)
        run: |
          test -z "$(gofmt -l internal cmd pkg)" || (gofmt -l internal cmd pkg; exit 1)
          go vet ./...
      - name: Test (root module)
        run: go test ./...
      - name: Test (legacy module)
        working-directory: legacy/server
        run: go test ./...

  e2e:
    name: E2E — API suite (scripts/e2e.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run E2E suite
        run: bash scripts/e2e.sh 8099

  frontend:
    name: Web — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  lighthouse:
    name: Lighthouse CI — Perf/SEO/A11y gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install LHCI
        run: npm install -g @lhci/cli@0.14.x
      - name: Start API (memory fallback)
        run: go run ./cmd/api &
        env:
          PORT: "8080"
      - name: Start web
        working-directory: client
        run: npm run build && npm run start -- --port 3000 &
      - name: Run Lighthouse CI
        run: lhci autorun --config=./lighthouserc.json
      - name: Fail build if gates not met
        if: failure()
        run: |
          echo "Lighthouse gates failed (Perf/SEO/A11y >= 90 required)"
          exit 1
