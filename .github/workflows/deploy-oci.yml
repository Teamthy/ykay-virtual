name: Deploy OCI

# Builds the API/worker/migrate image, pushes to GHCR, then deploys to the
# OCI Ampere VM over SSH with a health gate and automatic rollback
# (deploy/oci/deploy.sh).
#
# Runs only AFTER the CI workflow succeeds on main (same gate as the legacy
# Render deploy), or via manual dispatch. Replaces deploy.yml's Render hook
# once the OCI cutover is signed off.
#
# Required repository secrets:
#   OCI_HOST     public IP/hostname of the VM
#   OCI_USER     SSH user (ubuntu / opc)
#   OCI_SSH_KEY  private key authorized on the VM
#
# One-time host setup (documented in deploy/oci/README.md):
#   docker login ghcr.io with a read:packages PAT, deploy/ directory, .env.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "git ref to deploy (defaults to main HEAD)"
        required: false
        default: "main"

concurrency:
  group: deploy-oci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build image â†’ deploy OCI
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}

      - name: Set up QEMU (arm64 for OCI Ampere)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build & push (arm64 required, amd64 portable)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.sha }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Prepare /opt/ykay on server
        run: |
          ssh -i ~/.ssh/oci_key "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}" \
            'sudo mkdir -p /opt/ykay/virtual/backups && sudo chown -R "$(id -u):$(id -g)" /opt/ykay'

      - name: Sync deploy directory to server
        run: |
          scp -i ~/.ssh/oci_key -r deploy/oci \
            "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:/opt/ykay/virtual-new"
          ssh -i ~/.ssh/oci_key "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}" \
            'set -e
             mkdir -p /opt/ykay/virtual/backups
             cp /opt/ykay/virtual-new/docker-compose.oci.yml /opt/ykay/virtual/
             cp /opt/ykay/virtual-new/Caddyfile /opt/ykay/virtual/
             cp /opt/ykay/virtual-new/deploy.sh /opt/ykay/virtual/
             cp /opt/ykay/virtual-new/env.production.template /opt/ykay/virtual/
             chmod +x /opt/ykay/virtual/deploy.sh
             if [ ! -f /opt/ykay/virtual/.env ]; then
               cp /opt/ykay/virtual-new/env.production.template /opt/ykay/virtual/.env
               chmod 600 /opt/ykay/virtual/.env
               echo "âš  /opt/ykay/virtual/.env created from template â€” FILL IT before deploy"
             fi
             rm -rf /opt/ykay/virtual-new'

      - name: Remote deploy (health-gated, auto-rollback on failure)
        run: |
          ssh -i ~/.ssh/oci_key "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}" \
            "cd /opt/ykay/virtual && IMAGE_TAG=${{ steps.tag.outputs.sha }} ./deploy.sh"
