name: Deploy

# Production deploy (phase 42):
#   - web  → Vercel (needs VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID
#             secrets; set API_PROXY_TARGET / NEXT_PUBLIC_* in the project)
#   - api  → Render (needs RENDER_DEPLOY_HOOK secret — a Deploy Hook URL from
#             the Render dashboard for the api service).
#
# A-06: deploys are GATED on the CI workflow. This workflow triggers only
# after a completed CI run on main, and the deploy jobs run only when that CI
# run succeeded (workflow_dispatch remains a manual escape hatch).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-web:
    name: Deploy web → Vercel
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # A-06: fail loudly (and fast) when the Vercel secrets are missing
      # instead of dying deep inside `vercel pull` with a bare exit 1.
      - name: Check Vercel secrets (fail fast)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing — web was NOT deployed to Vercel. Set them in Settings → Secrets and variables → Actions."
            exit 1
          fi
      # Presence is not enough: a stale/renamed VERCEL_PROJECT_ID, or a token
      # that is not in VERCEL_ORG_ID's scope, makes `vercel pull` die with the
      # opaque "Error: Could not retrieve Project Settings. To link your
      # Project, remove the `.vercel` directory and deploy again." — advice
      # that cannot help in CI (there is no .vercel directory to remove, and
      # the IDs come from the repo secrets). Resolve them against the Vercel
      # API first so the log names the value that has to change.
      - name: Verify Vercel project resolves
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          probe() {
            curl -fsS -o /dev/null -H "Authorization: Bearer $VERCEL_TOKEN" "$1"
          }
          if probe "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            || probe "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID"; then
            echo "Vercel project $VERCEL_PROJECT_ID resolves ✔"
            exit 0
          fi
          echo "::error::Vercel cannot resolve project '$VERCEL_PROJECT_ID' in org '$VERCEL_ORG_ID' with this token — \`vercel pull\` will fail with 'Could not retrieve Project Settings'. Copy both values from Vercel → Project → Settings → General (Project ID / Team ID) into the VERCEL_PROJECT_ID and VERCEL_ORG_ID repo secrets (Settings → Secrets and variables → Actions)."
          exit 1

      - name: Install dependencies
        working-directory: client
        run: npm ci
      # CF-4: the production build ignores type errors (next.config sets
      # ignoreBuildErrors to keep constrained CI builds fast), so the ONLY
      # type gate for what actually ships is this explicit tsc run. It must
      # happen in the deploy path too — not just CI — or broken code can reach
      # production.
      - name: Type-check (authoritative type gate)
        working-directory: client
        run: npx tsc --noEmit
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: client
        run: |
          npx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-api:
    name: Deploy API → Render
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # A-06: fail loudly when the hook secret is missing instead of
          # silently skipping the API deploy (previously the job was skipped
          # by an `if` guard, so a misconfigured repo shipped web-only).
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set — the API was NOT deployed."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" || { echo "Render hook failed"; exit 1; }
          echo "Render deploy triggered — monitor https://dashboard.render.com"
