name: Fix Vercel root directory
# DIAGNOSE + FIX (v2): first map what this token/team can see, then patch.
# Known: ykay-virtual = prj_8vZMCgKG4nveomMXmwbU7ScGFTgw under team
# team_6rdP3L4iWU3LBf5qigaJ2iiF; its Root Directory has a leading space
# (" client") which breaks its Git-integration deploys (AUDIT doc:201).
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-vercel.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Hash-identify masked secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          h() { printf '%s' "$1" | sha256sum | cut -c1-16; }
          echo "::error::VERCEL_HASH project=$(h "${VERCEL_PROJECT_ID:-}") org=$(h "${VERCEL_ORG_ID:-}")"
