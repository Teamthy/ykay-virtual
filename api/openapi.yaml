      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, number, starts_on, ends_on]
              properties:
                name: { type: string }
                number: { type: integer, minimum: 1, maximum: 6 }
                starts_on: { type: string, format: date }
                ends_on: { type: string, format: date }
                enrollment_opens_at: { type: string, format: date-time }
                enrollment_closes_at: { type: string, format: date-time }
      responses:
        '200': { description: Updated }
        '409': { description: Closed term/session, or overlap/number clash }

  /admin/school/terms/{id}/status:
    post:
