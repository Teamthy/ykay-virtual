      security: [{ sessionCookie: [] }]
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Submissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GradedSubmission' }
  /learning/submissions/{submissionId}/grade:
    post:
      tags: [learning]
      summary: Grade a submission with score and feedback (tutor)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: submissionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score: { type: number, minimum: 0, maximum: 100 }
                feedback: { type: string }
      responses:
        '200':
          description: Graded submission
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/GradedSubmission' }
  /learning/progress-reports:
    post:
      tags: [learning]
      summary: Write a progress report (tutor, released to student + linked parent)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ProgressReport' }
    get:
      tags: [learning]
      summary: List progress reports (student/parent by student, or tutor by tutor)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: student_profile_id, in: query, schema: { type: string, format: uuid } }
        - { name: tutor_profile_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProgressReport' }
  /learning/lessons/{lessonId}/progress:
    post:
      tags: [learning]
      summary: Record a student's on-demand video watch progress for a lesson (000035)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                watched: { type: boolean }
                position_seconds: { type: integer }
      responses:
        '200':
          description: Saved progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LessonProgress' }
    get:
      tags: [learning]
      summary: Get a student's watch progress for a lesson
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Progress (or default unwatched)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LessonProgress' }
  /me/learning/progress:
    get:
      tags: [learning]
      summary: List the student's lesson progress across their courses (LMS summary)
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Lesson progress list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LessonProgress' }
  /admin/analytics:
    get:
      tags: [analytics]
      summary: Funnel, cohort and revenue analytics (admin)
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Analytics payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Analytics' }
        '403': { description: Admin access required }
  /admin/reports/attendance.csv:
    get:
      tags: [analytics]
      summary: Attendance CSV export (admin)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: lesson_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: CSV file
          content:
            text/csv: {}
  /admin/reports/revenue.csv:
    get:
      tags: [analytics]
      summary: Revenue by programme CSV export (admin)
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: CSV file
          content:
            text/csv: {}

  /library:
    get:
      tags: [library]
      summary: Browse the on-demand recorded-lesson library catalogue (public)
      description: >
        Returns recorded-lesson metadata for items admins marked `visible`.
        Video URLs and transcripts are only present for authenticated
        participants of the lesson's cohort/package (or admins); everyone else
        sees metadata only, so the shared public cache can never leak paid
        content.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Search title / cohort title }
        - { name: featured, in: query, schema: { type: boolean }, description: Only featured items }
        - { name: programme_id, in: query, schema: { type: string, format: uuid } }
        - { name: subject_id, in: query, schema: { type: string, format: uuid } }
        - { name: level_id, in: query, schema: { type: string, format: uuid } }
        - { name: curriculum_id, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses:
        '200': { description: Library catalogue (paged) }

  /library/featured:
    get:
      tags: [library]
      summary: Featured recorded lessons (homepage rail)
      responses:
        '200': { description: Featured items (metadata only) }

  /library/{lessonId}:
    get:
      tags: [library]
      summary: Recorded-lesson detail (metadata + entitlement-gated playback)
      parameters:
        - { name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Item with video_url/transcript only when entitled }
        '404': { description: Not found }

  /me/plus/library/{lessonId}/download:
    post:
      tags: [plus]
      summary: Get an authorized video URL to download a recorded lesson offline (YK-Virtual Plus)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: { video_url } for offline download }
        '402': { description: Requires an active YK-Virtual Plus plan }
        '403': { description: Not entitled to this lesson }
        '404': { description: Lesson not found or has no video }

  /admin/library:
    get:
      tags: [admin]
      summary: List every recorded lesson with its library curation (admin)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses:
        '200': { description: Recorded lessons + curation flags (paged) }

  /admin/library/{lessonId}:
    put:
      tags: [admin]
      summary: Curate a lesson's library row (visible/featured/thumbnail/duration/sort)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: lessonId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visible: { type: boolean }
                featured: { type: boolean }
                thumbnail_url: { type: string }
                duration_seconds: { type: integer }
                sort_order: { type: integer }
      responses:
        '200': { description: Updated item }
        '404': { description: Lesson not found }

components:
  securitySchemes:
    actorHeader:
      type: apiKey
      in: header
      name: X-User-ID
      description: Dev auth bridge (session takes precedence when present).
    sessionCookie:
      type: apiKey
      in: cookie
      name: ykv_session
      description: httpOnly session cookie set by /auth/login.
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        status: { type: string }
        timezone: { type: string }

    AuthUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        status: { type: string }
        timezone: { type: string }
        roles: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }

    Subject:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        category: { type: string }

    SubjectDetail:
      allOf:
        - $ref: '#/components/schemas/Subject'
        - type: object
          properties:
            programmes: { type: array, items: { type: object } }
            tutors: { type: array, items: { $ref: '#/components/schemas/TutorProfile' } }
            related_content: { type: array, items: { type: object } }

    TutorProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
        bio: { type: string }
        rating_avg: { type: number }
        rating_count: { type: integer }
        ranking_score: { type: number }
        subjects: { type: array, items: { $ref: '#/components/schemas/Subject' } }

    PaginatedSubjects:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Subject' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PaginatedTutors:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/TutorProfile' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PaginatedProgrammes:
      type: object
      properties:
        data: { type: array, items: { type: object } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }
        has_next: { type: boolean }
        has_prev: { type: boolean }

    CreateReview:
      type: object
      required: [tutor_profile_id, rating, consent_given]
      properties:
        tutor_profile_id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        consent_given: { type: boolean }

    Cohort:
      type: object
      properties:
        id: { type: string, format: uuid }
        programme_id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        tutor_profile_id: { type: string, format: uuid }
        capacity: { type: integer }
        enrolled_count: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        schedule_description: { type: string }
        timezone: { type: string }
        location_mode: { type: string, enum: [ONLINE, IN_PERSON, HYBRID] }
        fee: { type: number }
        currency: { type: string }
        status: { type: string }

    OrderItem:
      type: object
      properties:
        item_type: { type: string, enum: [COHORT, PRIVATE_PACKAGE, PRODUCT, FEE] }
        reference_id: { type: string, format: uuid }
        description: { type: string }
        quantity: { type: integer }
        total_price: { type: number }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_number: { type: string }
        status: { type: string, enum: [PENDING, PAID, FAILED, REFUNDED, CANCELLED] }
        subtotal: { type: number }
        discount_amount: { type: number }
        total_amount: { type: number }
        currency: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }

    BookingResponse:
      type: object
      properties:
        order: { $ref: '#/components/schemas/Order' }
        enrollment_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid }
        replayed: { type: boolean }
        payment_required: { type: boolean }

    InitiatePaymentResponse:
      type: object
      properties:
        payment_id: { type: string, format: uuid }
        order_number: { type: string }
        provider: { type: string }
        provider_reference: { type: string }
        amount: { type: number }
        currency: { type: string }
        payment_link: { type: string }
        status: { type: string }

    AdminStats:
      type: object
      properties:
        users: { type: integer }
        active_users: { type: integer }
        tutors_total: { type: integer }
        tutors_approved: { type: integer }
        tutors_pending: { type: integer }
        orders_total: { type: integer }
        orders_paid: { type: integer }
        revenue_in_escrow: { type: number }
        revenue_paid_out: { type: number }
        blog_published: { type: integer }
        blog_drafts: { type: integer }
        institutions: { type: integer }
        referrals: { type: integer }
        reviews_pending: { type: integer }
        support_open: { type: integer }
        escrow_disputed: { type: integer }

    BlogDraft:
      type: object
      required: [title, content]
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string }
        excerpt: { type: string }
        content: { type: string }
        status: { type: string, enum: [DRAFT, SCHEDULED, PUBLISHED, ARCHIVED] }
        seo_title: { type: string }
        seo_description: { type: string }
        subject_ids: { type: array, items: { type: string, format: uuid } }
        exam_ids: { type: array, items: { type: string, format: uuid } }

    BlogPost:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string }
        content: { type: string }
        seo_title: { type: string }
        seo_description: { type: string }
        published_at: { type: string, format: date-time }
        subject_slugs: { type: array, items: { type: string } }
        exam_slugs: { type: array, items: { type: string } }

    WebhookResult:
      type: object
      properties:
        processed: { type: boolean }
        duplicate: { type: boolean }
        ignored: { type: boolean }
        reason: { type: string }
        payment_id: { type: string, format: uuid }

    CreateTutorProfile:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 2 }
        headline: { type: string }
        bio: { type: string }
        years_experience: { type: integer, minimum: 0 }
        hourly_rate_min: { type: number, exclusiveMinimum: 0 }
        hourly_rate_max: { type: number }
        currency: { type: string, default: NGN }
        timezone: { type: string, default: Africa/Lagos }
        accepts_online: { type: boolean, default: true }
        accepts_in_person: { type: boolean, default: false }

    DocumentType:
      type: string
      enum: [GOVT_ID, CERTIFICATE, CV, REFERENCE_LETTER, GUARANTOR_ID, OTHER]

    VettingDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        tutor_profile_id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/DocumentType' }
        file_name: { type: string }
        file_size: { type: integer }
        mime_type: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        reviewed_at: { type: string, format: date-time }
        rejection_reason: { type: string }
        created_at: { type: string, format: date-time }

    TutorStatus:
      type: string
      enum: [DRAFT, SUBMITTED, UNDER_REVIEW, INTERVIEW, VERIFICATION, APPROVED, REJECTED, SUSPENDED, HOLD]

    VettingProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
        headline: { type: string }
        bio: { type: string }
        years_experience: { type: integer }
        hourly_rate_min: { type: number }
        hourly_rate_max: { type: number }
        currency: { type: string }
        status: { $ref: '#/components/schemas/TutorStatus' }
        is_public: { type: boolean }
        ranking_score: { type: number }
        timezone: { type: string }
        accepts_online: { type: boolean }
        accepts_in_person: { type: boolean }
        verified_at: { type: string, format: date-time }
        approved_at: { type: string, format: date-time }

    CreateAssessmentRequest:
      type: object
      required: [tutor_profile_id, title, questions]
      properties:
        tutor_profile_id: { type: string, format: uuid }
        cohort_id: { type: string, format: uuid }
        title: { type: string }
        instructions: { type: string }
        pass_threshold: { type: number, minimum: 0.01, maximum: 1, default: 0.5 }
        due_at: { type: string, format: date-time }
        questions:
          type: array
          minItems: 1
          items:
            type: object
            required: [question, options, correct_index]
            properties:
              question: { type: string }
              options:
                type: array
                minItems: 2
                items: { type: string }
              correct_index: { type: integer }
              explanation: { type: string }

    LearnerAssessment:
      type: object
      properties:
        id: { type: string, format: uuid }
        cohort_id: { type: string, format: uuid }
        lesson_id: { type: string, format: uuid }
        tutor_profile_id: { type: string, format: uuid }
        title: { type: string }
        instructions: { type: string }
        pass_threshold: { type: number }
        due_at: { type: string, format: date-time }
        status: { type: string, enum: [PUBLISHED, DRAFT, ARCHIVED] }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    AssessmentQuestionView:
      type: object
      properties:
        id: { type: string, format: uuid }
        question: { type: string }
        options:
          type: array
          items: { type: string }

    AssessmentStart:
      type: object
      properties:
        title: { type: string }
        pass_threshold: { type: number }
        attempt:
          type: object
          properties:
            id: { type: string, format: uuid }
            assessment_id: { type: string, format: uuid }
            student_profile_id: { type: string, format: uuid }
            status: { type: string, enum: [IN_PROGRESS, COMPLETED, EXPIRED] }
            started_at: { type: string, format: date-time }
            expires_at: { type: string, format: date-time }
        questions:
          type: array
          items: { $ref: '#/components/schemas/AssessmentQuestionView' }

    AssessmentResult:
      type: object
      properties:
        attempt_id: { type: string, format: uuid }
        score: { type: number }
        max_score: { type: number }
        passed: { type: boolean }
        correct: { type: integer }
        total: { type: integer }

    GradedSubmission:
      type: object
      properties:
        id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid }
        student_profile_id: { type: string, format: uuid }
        content: { type: string }
        submitted_at: { type: string, format: date-time }
        score: { type: number }
        feedback: { type: string }
        graded_at: { type: string, format: date-time }

    CreateReportRequest:
      type: object
      required: [student_profile_id, tutor_profile_id, period_start, period_end, overall_rating]
      properties:
        student_profile_id: { type: string, format: uuid }
        tutor_profile_id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        strengths: { type: string }
        weaknesses: { type: string }
        recommendations: { type: string }
        overall_rating: { type: integer, minimum: 1, maximum: 5 }

    ProgressReport:
      type: object
      properties:
        id: { type: string, format: uuid }
        student_profile_id: { type: string, format: uuid }
        tutor_profile_id: { type: string, format: uuid }
        period_start: { type: string, format: date }
        period_end: { type: string, format: date }
        strengths: { type: string }
        weaknesses: { type: string }
        recommendations: { type: string }
        overall_rating: { type: integer }
        created_at: { type: string, format: date-time }

    LessonProgress:
      type: object
      properties:
        id: { type: string, format: uuid }
        lesson_id: { type: string, format: uuid }
        student_profile_id: { type: string, format: uuid }
        watched: { type: boolean }
        position_seconds: { type: integer }
        watched_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Analytics:
      type: object
      properties:
        funnel: { $ref: '#/components/schemas/Funnel' }
        cohorts:
          type: array
          items: { $ref: '#/components/schemas/CohortAnalyticsRow' }
        revenue:
          type: array
          items: { $ref: '#/components/schemas/RevenueRow' }

    Funnel:
      type: object
      properties:
        registered_users: { type: integer, format: int64 }
        learners_created: { type: integer, format: int64 }
        orders_created: { type: integer, format: int64 }
        paid_orders: { type: integer, format: int64 }
        enrollments_confirmed: { type: integer, format: int64 }
        conversion_rate: { type: number }

    CohortAnalyticsRow:
      type: object
      properties:
        cohort_id: { type: string, format: uuid }
        title: { type: string }
        capacity: { type: integer }
        enrolled: { type: integer }
        fill_rate: { type: number }
        lessons_count: { type: integer, format: int64 }
        attendance_rate: { type: number }

    RevenueRow:
      type: object
      properties:
        programme_id: { type: string, format: uuid }
        programme_title: { type: string }
        revenue: { type: number }
        orders: { type: integer, format: int64 }
