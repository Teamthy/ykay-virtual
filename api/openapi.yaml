  /payments/initiate:
    post:
      tags: [payments]
      summary: >-
        Initiate payment for a PENDING order. Creates the payment row with a
        unique provider_reference and returns the hosted checkout link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, provider, email]
              properties:
                order_id: { type: string, format: uuid }
                provider: { type: string, enum: [PAYSTACK, FLUTTERWAVE] }
                email: { type: string, format: email }
                callback_url: { type: string }
      responses:
        '201':
          description: Payment pending + checkout link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiatePaymentResponse'
        '409': { description: Order not PENDING }

  /payments/webhooks/{provider}:
    post:
      tags: [payments]
      summary: >-
        Idempotent webhook (UNIQUE provider_reference, HMAC signature verified
        server-side â€” the client redirect is never trusted). Duplicate
        deliveries return 200 with duplicate=true; signature failures 400.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [PAYSTACK, FLUTTERWAVE] } }
        - { name: X-Paystack-Signature, in: header, schema: { type: string } }
        - { name: verif-hash, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResult'
        '400': { description: Invalid signature / malformed payload / amount mismatch }

