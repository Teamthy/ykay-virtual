openapi: 3.0.3
info:
  title: NUVORA API
  version: 1.0.0
  description: |
    Full commercial, SEO-first, curriculum-governed tutoring marketplace and virtual school.
    Built to Tuteria-level parity + beyond (blog, B2B, referrals, escrow, vetting).
servers:
  - url: http://localhost:8080/api/v1
    description: Local
  - url: https://api.nuvora.com/api/v1
    description: Production

tags:
  - name: identity
  - name: tutors
  - name: subjects
  - name: programmes
  - name: cohorts
  - name: bookings
  - name: payments
  - name: messaging
  - name: reviews
  - name: content
  - name: institutions
  - name: referrals
  - name: learning
  - name: analytics

paths:
  /auth/register:
    post:
      tags: [identity]
      summary: Register a user (bcrypt password, role assignment, audit logged)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, roles]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                roles: { type: array, items: { type: string, enum: [STUDENT, PARENT, TUTOR] } }
                phone: { type: string }
                timezone: { type: string, default: Africa/Lagos }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '409': { description: Email already registered }

  /auth/login:
    post:
      tags: [identity]
      summary: >-
        Log in with email + password. Verifies bcrypt hash, creates a session
        and returns an httpOnly `nuvora_session` cookie (raw token never leaves
        the cookie; only its SHA-256 hash is stored).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Logged in — sets httpOnly nuvora_session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401': { description: Invalid credentials }

  /auth/logout:
    post:
      tags: [identity]
      summary: Revoke the session and clear the cookie (idempotent)
      responses:
        '200': { description: Logged out }

  /auth/me:
    get:
      tags: [identity]
      summary: Current user + roles from the session cookie
      responses:
        '200':
          description: Session user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401': { description: Not authenticated / session expired or revoked }

  /auth/verify-email/request:
    post:
      tags: [identity]
      summary: Send email verification link (never reveals account existence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Sent (or silently skipped when unknown/already verified) }

  /auth/verify-email/confirm:
    post:
      tags: [identity]
      summary: Confirm email with the single-use token from the emailed link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Verified — account activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean }
                  status: { type: string }
        '400': { description: Invalid or expired token }
        '409': { description: Token already used }

  /auth/password-reset/request:
    post:
      tags: [identity]
      summary: Email a password reset link (never reveals account existence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Sent (or silently skipped when unknown) }

  /auth/password-reset/confirm:
    post:
      tags: [identity]
      summary: Set a new password with the single-use token; rotates ALL sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200': { description: Password updated, sessions rotated }
        '400': { description: Invalid/expired token or weak password }
        '409': { description: Token already used }

  /subjects:
    get:
      tags: [subjects]
      summary: List subjects with caching (60-300s TTL, invalidate on write)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, created_at] } }
      responses:
        '200':
          description: Subjects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubjects'

  /subjects/{slug}:
    get:
      tags: [subjects]
      summary: Get subject by slug (SSG+ISR)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Subject detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectDetail'

  /tutors/search:
    get:
      tags: [tutors]
      summary: Search tutors (Redis cached, p95 <300ms at 500 VU)
      parameters:
        - { name: subject, in: query, schema: { type: string } }
        - { name: location, in: query, schema: { type: string } }
        - { name: online, in: query, schema: { type: boolean } }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string, enum: [rating, ranking_score, price] } }
      responses:
        '200':
          description: Tutor list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTutors'

  /tutors/{slug}:
    get:
      tags: [tutors]
      summary: Tutor public profile (SSG+ISR, Person+AggregateRating JSON-LD)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Tutor profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorProfile'

  /programmes:
    get:
      tags: [programmes]
      summary: List programmes (filter by curriculum, level, exam, format)
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: curriculum, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [COHORT, PRIVATE, BOOTCAMP] } }
      responses:
        '200':
          description: Programmes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProgrammes'

  /cohorts:
    get:
      tags: [cohorts]
      summary: List cohorts
      parameters:
        - { name: programme_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Cohorts }

  /cohorts/{id}:
    get:
      tags: [cohorts]
      summary: Get cohort by id (checkout surface, cached 300s)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Cohort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cohort'
        '404': { description: Cohort not found }

  /bookings:
    post:
      tags: [bookings]
      summary: >-
        Create booking (COHORT enrollment or PRIVATE package) — transactional,
        bounded pool, no N+1. Idempotent via idempotency_key: a repeated key
        returns the original order (replayed=true) with no duplicate charge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, student_id]  # parent_user_id derived from the session (G1)
              properties:
                type: { type: string, enum: [PRIVATE, COHORT] }
                cohort_id: { type: string, format: uuid }
                subject_id: { type: string, format: uuid }
                tutor_profile_id: { type: string, format: uuid }
                parent_user_id: { type: string, format: uuid }
                student_id: { type: string, format: uuid }
                total_sessions: { type: integer, minimum: 1 }
                session_duration_minutes: { type: integer, minimum: 15 }
                price_per_session: { type: number, exclusiveMinimum: 0 }
                currency: { type: string, default: NGN }
                goals: { type: string }
                preferred_days: { type: string }
                preferred_time_range: { type: string }
                idempotency_key: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Booking created (order PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '403': { description: Student not linked to parent / tutor cannot teach }
        '409': { description: Capacity full, duplicate enrollment, or order conflict }

  /payments/initiate:
    post:
      tags: [payments]
      summary: >-
        Initiate payment for a PENDING order. Creates the payment row with a
        unique provider_reference and returns the hosted checkout link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, provider, email]
              properties:
                order_id: { type: string, format: uuid }
                provider: { type: string, enum: [PAYSTACK, FLUTTERWAVE] }
                email: { type: string, format: email }
                callback_url: { type: string }
      responses:
        '201':
          description: Payment pending + checkout link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiatePaymentResponse'
        '409': { description: Order not PENDING }

  /payments/webhooks/{provider}:
    post:
      tags: [payments]
      summary: >-
        Idempotent webhook (UNIQUE provider_reference, HMAC signature verified
        server-side — the client redirect is never trusted). Duplicate
        deliveries return 200 with duplicate=true; signature failures 400.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [PAYSTACK, FLUTTERWAVE] } }
        - { name: X-Paystack-Signature, in: header, schema: { type: string } }
        - { name: verif-hash, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResult'
        '400': { description: Invalid signature / malformed payload / amount mismatch }

  /tutors/me/vetting/profile:
    post:
      tags: [tutors]
      summary: Create draft tutor profile (vetting pipeline entry)
      security: [{ actorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTutorProfile'
      responses:
        '201': { description: Draft profile created, content: { application/json: { schema: { $ref: '#/components/schemas/VettingProfile' } } } }
        '409': { description: Profile already exists }
    get:
      tags: [tutors]
      summary: Get own vetting profile
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/VettingProfile' } } } }
        '404': { description: No profile yet }

  /tutors/me/vetting/profiles/{profileId}/subjects:
    post:
      tags: [tutors]
      summary: Add teaching subject to vetting profile (owner only)
      security: [{ actorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id]
              properties:
                subject_id: { type: string, format: uuid }
      responses:
        '201': { description: Subject added }
    get:
      tags: [tutors]
      summary: List my teaching subjects
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Subjects }

  /tutors/me/vetting/profiles/{profileId}/submit:
    post:
      tags: [tutors]
      summary: Submit profile for review (DRAFT to SUBMITTED, owner only)
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Submitted }
        '400': { description: Incomplete profile }

  /tutors/me/vetting/profiles/{profileId}/documents:
    post:
      tags: [tutors]
      summary: Request signed upload URL for a vetting document (PRIVATE bucket)
      security: [{ actorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, file_name]
              properties:
                type: { $ref: '#/components/schemas/DocumentType' }
                file_name: { type: string }
                mime_type: { type: string }
                file_size: { type: integer }
      responses:
        '201':
          description: Document row + signed PUT URL (15 min)
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/VettingDocument' }
                  upload_url: { type: string }

  /tutors/me/vetting/documents/{documentId}:
    get:
      tags: [tutors]
      summary: Signed view URL (owner or admin only, server authz first)
      security: [{ actorHeader: [] }]
      responses:
        '200':
          description: Signed GET URL (5 min)
          content:
            application/json:
              schema:
                type: object
                properties:
                  signed_url: { type: string }

  /tutors/me/vetting/profiles/{profileId}/assessments:
    post:
      tags: [tutors]
      summary: Start competency quiz attempt (5 questions, 30 min)
      security: [{ actorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id]
              properties:
                subject_id: { type: string, format: uuid }
      responses:
        '201': { description: Attempt + questions (no answer keys) }
        '409': { description: Attempt already active / passed / question bank not ready }

  /tutors/me/vetting/assessments/{attemptId}/submit:
    post:
      tags: [tutors]
      summary: Submit answers (70% pass, 12-month competency validity)
      security: [{ actorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    required: [question_id, chosen_index]
                    properties:
                      question_id: { type: string, format: uuid }
                      chosen_index: { type: integer, minimum: 0 }
      responses:
        '200': { description: Graded result }

  /admin/vetting/queue:
    get:
      tags: [admin]
      summary: Vetting review queue (admin only)
      security: [{ actorHeader: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses:
        '200': { description: Paginated profiles }

  /admin/vetting/profiles/{profileId}:
    get:
      tags: [admin]
      summary: Full vetting dossier (documents, subjects, competency, events)
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Dossier }

  /admin/vetting/profiles/{profileId}/{action}:
    post:
      tags: [admin]
      summary: Admin workflow action — review | interview | verify | approve | reject | hold | suspend
      security: [{ actorHeader: [] }]
      parameters:
        - { name: action, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: Transition applied }

  /admin/vetting/documents/{documentId}/review:
    post:
      tags: [admin]
      summary: Approve/reject a vetting document (rejection requires reason)
      security: [{ actorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
                reason: { type: string }
      responses:
        '200': { description: Reviewed }

  /me/conversations:
    get:
      tags: [messaging]
      summary: My conversations (participant only, paginated)
      security: [{ actorHeader: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses:
        '200': { description: Conversations with meta }
    post:
      tags: [messaging]
      summary: Create booking/cohort conversation
      security: [{ actorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [BOOKING, COHORT] }
                package_id: { type: string, format: uuid }
                cohort_id: { type: string, format: uuid }
                participant_user_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '201': { description: Conversation }

  /me/conversations/{conversationId}/messages:
    get:
      tags: [messaging]
      summary: List messages (participant only, newest first)
      security: [{ actorHeader: [] }]
      parameters:
        - { name: before, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: Messages }
    post:
      tags: [messaging]
      summary: Send message (notifies other participants)
      security: [{ actorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                type: { type: string, default: TEXT }
                body: { type: string, maxLength: 4000 }
      responses:
        '201': { description: Message }

  /me/conversations/{conversationId}/read:
    post:
      tags: [messaging]
      summary: Mark conversation read
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Marked }

  /me/notifications:
    get:
      tags: [messaging]
      summary: My notifications (paginated)
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Notifications }

  /me/notifications/unread-count:
    get:
      tags: [messaging]
      summary: Unread notification count
      security: [{ actorHeader: [] }]
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer }

  /me/notifications/{notificationId}/read:
    post:
      tags: [messaging]
      summary: Mark one notification read
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Marked }

  /me/notifications/read-all:
    post:
      tags: [messaging]
      summary: Mark all notifications read
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Marked }

  /me/orders:
    get:
      tags: [identity]
      summary: My orders (parent portal)
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Orders }

  /me/lessons:
    get:
      tags: [identity]
      summary: Lessons for a linked student (student portal)
      security: [{ actorHeader: [] }]
      parameters:
        - { name: student_profile_id, in: query, required: false, description: "Optional — resolved from the session; a supplied ID must belong to the caller (403 otherwise).", schema: { type: string, format: uuid } }
      responses:
        '200': { description: Lessons }

  /me/tutor-lessons:
    get:
      tags: [identity]
      summary: Lessons for a tutor profile
      security: [{ actorHeader: [] }]
      parameters:
        - { name: tutor_profile_id, in: query, required: false, description: "Optional — resolved from the session; a supplied ID must belong to the caller (403 otherwise).", schema: { type: string, format: uuid } }
      responses:
        '200': { description: Lessons }

  /me/earnings:
    get:
      tags: [identity]
      summary: Tutor earnings (escrow holds + payouts)
      security: [{ actorHeader: [] }]
      parameters:
        - { name: tutor_profile_id, in: query, required: false, description: "Optional — resolved from the session; a supplied ID must belong to the caller (403 otherwise).", schema: { type: string, format: uuid } }
      responses:
        '200': { description: Earnings summary }

  /content/testimonials:
    get:
      tags: [content]
      summary: Public testimonials (consent-given + is_public only, featured first)
      parameters:
        - { name: featured, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Consent-gated testimonials
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    author_name: { type: string }
                    author_location: { type: string }
                    author_role: { type: string }
                    body: { type: string }
                    rating: { type: integer }
                    is_featured: { type: boolean }

  /support/tickets:
    post:
      tags: [support]
      summary: Open a support ticket (G5.2 — categorised intake with SLA)
      description: |
        SAFEGUARDING tickets get a 4-hour SLA and severity floored at MEDIUM;
        HIGH/URGENT get 8h; default 24h. Unknown categories are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, subject, message]
              properties:
                email: { type: string, format: email }
                subject: { type: string }
                message: { type: string }
                category:
                  type: string
                  enum: [GENERAL, SAFEGUARDING, FINANCE, ACADEMIC]
                severity:
                  type: string
                  enum: [LOW, MEDIUM, HIGH, URGENT]
      responses:
        '201': { description: Ticket created (includes category, severity, sla_due_at) }
        '400': { description: Unknown category/severity or invalid input }

  /admin/testimonials/{testimonialId}/public:
    post:
      tags: [admin]
      summary: Approve/withdraw a testimonial for public display (G5.3 sign-off)
      description: |
        Publication sign-off. Approval REQUIRES consent_given on the
        testimonial (403 otherwise); the acting admin is recorded.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: testimonialId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_public]
              properties:
                is_public: { type: boolean }
      responses:
        '200': { description: Publication state updated }
        '403': { description: No consent on file, or not an admin }

  /admin/programmes/{programmeId}/status:
    post:
      tags: [admin]
      summary: Publish/unpublish a programme (G5.3 — catalogue operable without deploys)
      description: |
        DRAFT/PUBLISHED/ARCHIVED transitions. Publishing stamps published_at
        and a 90-day review_due_at; unpublishing clears both and flushes the
        cached catalogue. Audited against the acting admin.
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: programmeId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [DRAFT, PUBLISHED, ARCHIVED] }
      responses:
        '200': { description: Status updated }
        '403': { description: Not an admin }
        '404': { description: Unknown programme }

  /admin/testimonials:
    post:
      tags: [admin]
      summary: Create a testimonial (consent_given required; is_public gates visibility)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [author_name, body, consent_given]
              properties:
                author_name: { type: string }
                author_location: { type: string }
                author_role: { type: string }
