openapi: 3.0.3
info:
  title: YKAY Virtual School API
  version: 1.0.0
  description: |
    Full commercial, SEO-first, curriculum-governed tutoring marketplace and virtual school.
    Built to Tuteria-level parity + beyond (blog, B2B, referrals, escrow, vetting).
servers:
  - url: http://localhost:8080/api/v1
    description: Local
  - url: https://api.ykay.com/api/v1
    description: Production

tags:
  - name: identity
  - name: tutors
  - name: subjects
  - name: programmes
  - name: cohorts
  - name: bookings
  - name: payments
  - name: messaging
  - name: reviews
  - name: content
  - name: institutions
  - name: referrals

paths:
  /auth/register:
    post:
      tags: [identity]
      summary: Register a user (bcrypt password, role assignment, audit logged)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, roles]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                roles: { type: array, items: { type: string, enum: [STUDENT, PARENT, TUTOR] } }
                phone: { type: string }
                timezone: { type: string, default: Africa/Lagos }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '409': { description: Email already registered }

  /auth/login:
    post:
      tags: [identity]
      summary: >-
        Log in with email + password. Verifies bcrypt hash, creates a session
        and returns an httpOnly `ykay_session` cookie (raw token never leaves
        the cookie; only its SHA-256 hash is stored).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Logged in — sets httpOnly ykay_session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401': { description: Invalid credentials }

  /auth/logout:
    post:
      tags: [identity]
      summary: Revoke the session and clear the cookie (idempotent)
      responses:
        '200': { description: Logged out }

  /auth/me:
    get:
      tags: [identity]
      summary: Current user + roles from the session cookie
      responses:
        '200':
          description: Session user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401': { description: Not authenticated / session expired or revoked }

  /auth/verify-email/request:
    post:
      tags: [identity]
      summary: Send email verification link (never reveals account existence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Sent (or silently skipped when unknown/already verified) }

  /auth/verify-email/confirm:
    post:
      tags: [identity]
      summary: Confirm email with the single-use token from the emailed link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Verified — account activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean }
                  status: { type: string }
        '400': { description: Invalid or expired token }
        '409': { description: Token already used }

  /auth/password-reset/request:
    post:
      tags: [identity]
      summary: Email a password reset link (never reveals account existence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Sent (or silently skipped when unknown) }

  /auth/password-reset/confirm:
    post:
      tags: [identity]
      summary: Set a new password with the single-use token; rotates ALL sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200': { description: Password updated, sessions rotated }
        '400': { description: Invalid/expired token or weak password }
        '409': { description: Token already used }

  /subjects:
    get:
      tags: [subjects]
      summary: List subjects with caching (60-300s TTL, invalidate on write)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, created_at] } }
      responses:
        '200':
          description: Subjects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubjects'

  /subjects/{slug}:
    get:
      tags: [subjects]
      summary: Get subject by slug (SSG+ISR)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Subject detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectDetail'

  /tutors/search:
    get:
      tags: [tutors]
      summary: Search tutors (Redis cached, p95 <300ms at 500 VU)
      parameters:
        - { name: subject, in: query, schema: { type: string } }
        - { name: location, in: query, schema: { type: string } }
        - { name: online, in: query, schema: { type: boolean } }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string, enum: [rating, ranking_score, price] } }
      responses:
        '200':
          description: Tutor list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTutors'

  /tutors/{slug}:
    get:
      tags: [tutors]
      summary: Tutor public profile (SSG+ISR, Person+AggregateRating JSON-LD)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Tutor profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorProfile'

  /programmes:
    get:
      tags: [programmes]
      summary: List programmes (filter by curriculum, level, exam, format)
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: curriculum, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [COHORT, PRIVATE, BOOTCAMP] } }
      responses:
        '200':
          description: Programmes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProgrammes'

  /cohorts:
    get:
      tags: [cohorts]
      summary: List cohorts
      parameters:
        - { name: programme_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Cohorts }

  /cohorts/{id}:
    get:
      tags: [cohorts]
      summary: Get cohort by id (checkout surface, cached 300s)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Cohort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cohort'
        '404': { description: Cohort not found }

  /bookings:
    post:
      tags: [bookings]
      summary: >-
        Create booking (COHORT enrollment or PRIVATE package) — transactional,
        bounded pool, no N+1. Idempotent via idempotency_key: a repeated key
        returns the original order (replayed=true) with no duplicate charge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, parent_user_id, student_id]
              properties:
                type: { type: string, enum: [PRIVATE, COHORT] }
                cohort_id: { type: string, format: uuid }
                subject_id: { type: string, format: uuid }
                tutor_profile_id: { type: string, format: uuid }
                parent_user_id: { type: string, format: uuid }
                student_id: { type: string, format: uuid }
                total_sessions: { type: integer, minimum: 1 }
                session_duration_minutes: { type: integer, minimum: 15 }
                price_per_session: { type: number, exclusiveMinimum: 0 }
                currency: { type: string, default: NGN }
                goals: { type: string }
                preferred_days: { type: string }
                preferred_time_range: { type: string }
                idempotency_key: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Booking created (order PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '403': { description: Student not linked to parent / tutor cannot teach }
        '409': { description: Capacity full, duplicate enrollment, or order conflict }

  /payments/initiate:
    post:
      tags: [payments]
      summary: >-
        Initiate payment for a PENDING order. Creates the payment row with a
        unique provider_reference and returns the hosted checkout link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, provider, email]
              properties:
                order_id: { type: string, format: uuid }
                provider: { type: string, enum: [PAYSTACK, FLUTTERWAVE] }
                email: { type: string, format: email }
                callback_url: { type: string }
      responses:
        '201':
          description: Payment pending + checkout link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiatePaymentResponse'
        '409': { description: Order not PENDING }

  /payments/webhooks/{provider}:
    post:
      tags: [payments]
      summary: >-
        Idempotent webhook (UNIQUE provider_reference, HMAC signature verified
        server-side — the client redirect is never trusted). Duplicate
        deliveries return 200 with duplicate=true; signature failures 400.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [PAYSTACK, FLUTTERWAVE] } }
        - { name: X-Paystack-Signature, in: header, schema: { type: string } }
        - { name: verif-hash, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResult'
        '400': { description: Invalid signature / malformed payload / amount mismatch }

  /tutors/me/vetting/profile:
    post:
      tags: [tutors]
      summary: Create draft tutor profile (vetting pipeline entry)
      security: [{ actorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTutorProfile'
      responses:
        '201': { description: Draft profile created, content: { application/json: { schema: { $ref: '#/components/schemas/VettingProfile' } } } }
        '409': { description: Profile already exists }
    get:
      tags: [tutors]
      summary: Get own vetting profile
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/VettingProfile' } } } }
        '404': { description: No profile yet }

  /tutors/me/vetting/profiles/{profileId}/subjects:
    post:
      tags: [tutors]
      summary: Add teaching subject to vetting profile (owner only)
      security: [{ actorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id]
              properties:
                subject_id: { type: string, format: uuid }
      responses:
        '201': { description: Subject added }
    get:
      tags: [tutors]
      summary: List my teaching subjects
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Subjects }

  /tutors/me/vetting/profiles/{profileId}/submit:
    post:
      tags: [tutors]
      summary: Submit profile for review (DRAFT to SUBMITTED, owner only)
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Submitted }
        '400': { description: Incomplete profile }

  /tutors/me/vetting/profiles/{profileId}/documents:
    post:
      tags: [tutors]
      summary: Request signed upload URL for a vetting document (PRIVATE bucket)
      security: [{ actorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, file_name]
              properties:
                type: { $ref: '#/components/schemas/DocumentType' }
                file_name: { type: string }
                mime_type: { type: string }
                file_size: { type: integer }
      responses:
        '201':
          description: Document row + signed PUT URL (15 min)
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/VettingDocument' }
                  upload_url: { type: string }

  /tutors/me/vetting/documents/{documentId}:
    get:
      tags: [tutors]
      summary: Signed view URL (owner or admin only, server authz first)
      security: [{ actorHeader: [] }]
      responses:
        '200':
          description: Signed GET URL (5 min)
          content:
            application/json:
              schema:
                type: object
                properties:
                  signed_url: { type: string }

  /tutors/me/vetting/profiles/{profileId}/assessments:
    post:
      tags: [tutors]
      summary: Start competency quiz attempt (5 questions, 30 min)
      security: [{ actorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_id]
              properties:
                subject_id: { type: string, format: uuid }
      responses:
        '201': { description: Attempt + questions (no answer keys) }
        '409': { description: Attempt already active / passed / question bank not ready }

  /tutors/me/vetting/assessments/{attemptId}/submit:
    post:
      tags: [tutors]
      summary: Submit answers (70% pass, 12-month competency validity)
      security: [{ actorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items:
                    type: object
                    required: [question_id, chosen_index]
                    properties:
                      question_id: { type: string, format: uuid }
                      chosen_index: { type: integer, minimum: 0 }
      responses:
        '200': { description: Graded result }

  /admin/vetting/queue:
    get:
      tags: [admin]
      summary: Vetting review queue (admin only)
      security: [{ actorHeader: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses:
        '200': { description: Paginated profiles }

  /admin/vetting/profiles/{profileId}:
    get:
      tags: [admin]
      summary: Full vetting dossier (documents, subjects, competency, events)
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Dossier }

  /admin/vetting/profiles/{profileId}/{action}:
    post:
      tags: [admin]
      summary: Admin workflow action — review | interview | verify | approve | reject | hold | suspend
      security: [{ actorHeader: [] }]
      parameters:
        - { name: action, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200': { description: Transition applied }

  /admin/vetting/documents/{documentId}/review:
    post:
      tags: [admin]
      summary: Approve/reject a vetting document (rejection requires reason)
      security: [{ actorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approve]
              properties:
                approve: { type: boolean }
                reason: { type: string }
      responses:
        '200': { description: Reviewed }

  /me/conversations:
    get:
      tags: [messaging]
      summary: My conversations (participant only, paginated)
      security: [{ actorHeader: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses:
        '200': { description: Conversations with meta }
    post:
      tags: [messaging]
      summary: Create booking/cohort conversation
      security: [{ actorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [BOOKING, COHORT] }
                package_id: { type: string, format: uuid }
                cohort_id: { type: string, format: uuid }
                participant_user_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        '201': { description: Conversation }

  /me/conversations/{conversationId}/messages:
    get:
      tags: [messaging]
      summary: List messages (participant only, newest first)
      security: [{ actorHeader: [] }]
      parameters:
        - { name: before, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200': { description: Messages }
    post:
      tags: [messaging]
      summary: Send message (notifies other participants)
      security: [{ actorHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                type: { type: string, default: TEXT }
                body: { type: string, maxLength: 4000 }
      responses:
        '201': { description: Message }

  /me/conversations/{conversationId}/read:
    post:
      tags: [messaging]
      summary: Mark conversation read
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Marked }

  /me/notifications:
    get:
      tags: [messaging]
      summary: My notifications (paginated)
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Notifications }

  /me/notifications/unread-count:
    get:
      tags: [messaging]
      summary: Unread notification count
      security: [{ actorHeader: [] }]
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread: { type: integer }

  /me/notifications/{notificationId}/read:
    post:
      tags: [messaging]
      summary: Mark one notification read
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Marked }

  /me/notifications/read-all:
    post:
      tags: [messaging]
      summary: Mark all notifications read
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Marked }

  /me/orders:
    get:
      tags: [identity]
      summary: My orders (parent portal)
      security: [{ actorHeader: [] }]
      responses:
        '200': { description: Orders }

  /me/lessons:
    get:
      tags: [identity]
      summary: Lessons for a linked student (student portal)
      security: [{ actorHeader: [] }]
      parameters:
        - { name: student_profile_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Lessons }

  /me/tutor-lessons:
    get:
      tags: [identity]
      summary: Lessons for a tutor profile
      security: [{ actorHeader: [] }]
      parameters:
        - { name: tutor_profile_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Lessons }

  /me/earnings:
    get:
      tags: [identity]
      summary: Tutor earnings (escrow holds + payouts)
      security: [{ actorHeader: [] }]
      parameters:
        - { name: tutor_profile_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Earnings summary }

  /content/blog:
    get:
      tags: [content]
      summary: Published blog posts (SSG+ISR, subject/exam filtered, cached 300s)
      parameters:
        - { name: subject, in: query, schema: { type: string } }
        - { name: exam, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Paginated posts with subject/exam tags
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/BlogPost' } }

  /content/blog/{slug}:
    get:
      tags: [content]
      summary: Published post by slug (Article JSON-LD source, cached 600s)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Post with tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BlogPost'
        '404': { description: Not published / not found }

  /subjects/{slug}/related:
    get:
      tags: [content]
      summary: Related-content graph (approved tutors + published programmes + posts)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Related content buckets
          content:
            application/json:
              schema:
                type: object
                properties:
                  tutors: { type: array, items: { $ref: '#/components/schemas/TutorProfile' } }
                  programmes: { type: array, items: { type: object } }
                  posts: { type: array, items: { $ref: '#/components/schemas/BlogPost' } }

  /redirects/{slug}:
    get:
      tags: [content]
      summary: Resolve a renamed slug (RedirectMap table → 301s; fixes soft-404s)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Redirect mapping
          content:
            application/json:
              schema:
                type: object
                properties:
                  from_slug: { type: string }
                  to_slug: { type: string }
                  type: { type: string }
        '404': { description: No mapping }

  /admin/stats:
    get:
      tags: [admin]
      summary: Operations overview (users, tutors, orders, escrow, content)
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Dashboard aggregates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'
        '403': { description: Admin role required }

  /admin/blog:
    get:
      tags: [admin]
      summary: List all blog posts (any status) with search + pagination
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, SCHEDULED, PUBLISHED, ARCHIVED] } }
        - { name: search, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
      responses:
        '200': { description: Paginated posts }
    post:
      tags: [admin]
      summary: Create blog post (slug auto-generated, subject/exam tags)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogDraft'
      responses:
        '201': { description: Created }

  /admin/blog/{postId}:
    put:
      tags: [admin]
      summary: Update blog post fields + tags
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlogDraft'
      responses:
        '200': { description: Updated }

  /admin/blog/{postId}/status:
    post:
      tags: [admin]
      summary: Publish / unpublish / archive a post (published_at set once)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: postId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [DRAFT, SCHEDULED, PUBLISHED, ARCHIVED] }
      responses:
        '200': { description: Status applied }

  /admin/institutions:
    get:
      tags: [admin]
      summary: B2B institution accounts (schools/corporate)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200': { description: Paginated institutions }

  /admin/referrals:
    get:
      tags: [admin]
      summary: Referral programme list
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200': { description: Paginated referrals }

  /admin/reviews:
    get:
      tags: [admin]
      summary: Review moderation queue
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, PUBLISHED, HIDDEN, FLAGGED] } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200': { description: Paginated reviews }

  /admin/reviews/{reviewId}/moderate:
    post:
      tags: [admin]
      summary: Publish/hide/flag a review (publish requires consent_given)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: reviewId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [PUBLISHED, HIDDEN, FLAGGED] }
      responses:
        '200': { description: Moderated }
        '409': { description: Publish without consent rejected }

  /reviews:
    post:
      tags: [reviews]
      summary: >-
        Submit a review for a tutor (parent, booking-scoped). Consent is
        required; the review starts PENDING and publishes after admin
        moderation (which recomputes the tutor's rating).
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tutor_profile_id, rating, consent_given]
              properties:
                tutor_profile_id: { type: string, format: uuid }
                booking_id: { type: string, format: uuid }
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string }
                comment: { type: string }
                consent_given: { type: boolean }
      responses:
        '201': { description: Review pending moderation }
        '409': { description: Already reviewed this tutor }
        '400': { description: Consent required / invalid rating }

  /tutors/{slug}/reviews:
    get:
      tags: [reviews]
      summary: Published reviews for a tutor (consent-gated, Review JSON-LD source)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Published + public + consented reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    rating: { type: integer }
                    title: { type: string }
                    comment: { type: string }
                    created_at: { type: string, format: date-time }

  /me/referral-code:
    get:
      tags: [referrals]
      summary: My shareable referral code (created on first request)
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Code + reward amount + share link
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  is_active: { type: boolean }
                  reward: { type: number }
                  currency: { type: string }
                  share_link: { type: string }

  /referrals/apply:
    post:
      tags: [referrals]
      summary: Apply a referral code to my account (PENDING until first paid order)
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '201': { description: Referral recorded }
        '404': { description: Invalid code }
        '409': { description: Account already referred }

  /me/referrals:
    get:
      tags: [referrals]
      summary: My sent referrals with statuses
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Referral list }

  /institutions:
    post:
      tags: [institutions]
      summary: Create a B2B institution account (schools/corporate; owner membership when signed in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                type: { type: string, enum: [SCHOOL, CORPORATE, GOVERNMENT, NGO, OTHER] }
                email: { type: string, format: email }
                phone: { type: string }
                website: { type: string }
                description: { type: string }
      responses:
        '201': { description: Institution created }


    post:
      tags: [reviews]
      summary: Create review (consent-gated, booking-scoped)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReview'
      responses:
        '201': { description: Review pending moderation }

  /content/blog:
    get:
      tags: [content]
      summary: Blog posts (subject/exam-tagged, SSG+ISR, Article JSON-LD)
      parameters:
        - { name: subject, in: query, schema: { type: string } }
        - { name: exam, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200': { description: Blog list }

  /institutions:
    post:
      tags: [institutions]
      summary: Create B2B institution (for-schools, corporate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type: { type: string, enum: [SCHOOL, CORPORATE] }
      responses:
        '201': { description: Institution created }

components:
  securitySchemes:
    actorHeader:
      type: apiKey
      in: header
      name: X-User-ID
      description: Dev auth bridge (session takes precedence when present).
    sessionCookie:
      type: apiKey
      in: cookie
      name: ykay_session
      description: httpOnly session cookie set by /auth/login.
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        status: { type: string }
        timezone: { type: string }

    AuthUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        status: { type: string }
        timezone: { type: string }
        roles: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }

    Subject:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        category: { type: string }

    SubjectDetail:
      allOf:
        - $ref: '#/components/schemas/Subject'
        - type: object
          properties:
            programmes: { type: array, items: { type: object } }
            tutors: { type: array, items: { $ref: '#/components/schemas/TutorProfile' } }
            related_content: { type: array, items: { type: object } }

    TutorProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
        bio: { type: string }
        rating_avg: { type: number }
        rating_count: { type: integer }
        ranking_score: { type: number }
        subjects: { type: array, items: { $ref: '#/components/schemas/Subject' } }

    PaginatedSubjects:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Subject' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PaginatedTutors:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/TutorProfile' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PaginatedProgrammes:
      type: object
      properties:
        data: { type: array, items: { type: object } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }
        has_next: { type: boolean }
        has_prev: { type: boolean }

    CreateReview:
      type: object
      required: [tutor_profile_id, rating, consent_given]
      properties:
        tutor_profile_id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        consent_given: { type: boolean }

    Cohort:
      type: object
      properties:
        id: { type: string, format: uuid }
        programme_id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        tutor_profile_id: { type: string, format: uuid }
        capacity: { type: integer }
        enrolled_count: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        schedule_description: { type: string }
        timezone: { type: string }
        location_mode: { type: string, enum: [ONLINE, IN_PERSON, HYBRID] }
        fee: { type: number }
        currency: { type: string }
        status: { type: string }

    OrderItem:
      type: object
      properties:
        item_type: { type: string, enum: [COHORT, PRIVATE_PACKAGE, PRODUCT, FEE] }
        reference_id: { type: string, format: uuid }
        description: { type: string }
        quantity: { type: integer }
        total_price: { type: number }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_number: { type: string }
        status: { type: string, enum: [PENDING, PAID, FAILED, REFUNDED, CANCELLED] }
        subtotal: { type: number }
        discount_amount: { type: number }
        total_amount: { type: number }
        currency: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }

    BookingResponse:
      type: object
      properties:
        order: { $ref: '#/components/schemas/Order' }
        enrollment_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid }
        replayed: { type: boolean }
        payment_required: { type: boolean }

    InitiatePaymentResponse:
      type: object
      properties:
        payment_id: { type: string, format: uuid }
        order_number: { type: string }
        provider: { type: string }
        provider_reference: { type: string }
        amount: { type: number }
        currency: { type: string }
        payment_link: { type: string }
        status: { type: string }

    AdminStats:
      type: object
      properties:
        users: { type: integer }
        active_users: { type: integer }
        tutors_total: { type: integer }
        tutors_approved: { type: integer }
        tutors_pending: { type: integer }
        orders_total: { type: integer }
        orders_paid: { type: integer }
        revenue_in_escrow: { type: number }
        revenue_paid_out: { type: number }
        blog_published: { type: integer }
        blog_drafts: { type: integer }
        institutions: { type: integer }
        referrals: { type: integer }
        reviews_pending: { type: integer }
        support_open: { type: integer }
        escrow_disputed: { type: integer }

    BlogDraft:
      type: object
      required: [title, content]
      properties:
        title: { type: string, minLength: 1 }
        slug: { type: string }
        excerpt: { type: string }
        content: { type: string }
        status: { type: string, enum: [DRAFT, SCHEDULED, PUBLISHED, ARCHIVED] }
        seo_title: { type: string }
        seo_description: { type: string }
        subject_ids: { type: array, items: { type: string, format: uuid } }
        exam_ids: { type: array, items: { type: string, format: uuid } }

    BlogPost:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        excerpt: { type: string }
        content: { type: string }
        seo_title: { type: string }
        seo_description: { type: string }
        published_at: { type: string, format: date-time }
        subject_slugs: { type: array, items: { type: string } }
        exam_slugs: { type: array, items: { type: string } }

    WebhookResult:
      type: object
      properties:
        processed: { type: boolean }
        duplicate: { type: boolean }
        ignored: { type: boolean }
        reason: { type: string }
        payment_id: { type: string, format: uuid }

    CreateTutorProfile:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 2 }
        headline: { type: string }
        bio: { type: string }
        years_experience: { type: integer, minimum: 0 }
        hourly_rate_min: { type: number, exclusiveMinimum: 0 }
        hourly_rate_max: { type: number }
        currency: { type: string, default: NGN }
        timezone: { type: string, default: Africa/Lagos }
        accepts_online: { type: boolean, default: true }
        accepts_in_person: { type: boolean, default: false }

    DocumentType:
      type: string
      enum: [GOVT_ID, CERTIFICATE, CV, REFERENCE_LETTER, GUARANTOR_ID, OTHER]

    VettingDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        tutor_profile_id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/DocumentType' }
        file_name: { type: string }
        file_size: { type: integer }
        mime_type: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        reviewed_at: { type: string, format: date-time }
        rejection_reason: { type: string }
        created_at: { type: string, format: date-time }

    TutorStatus:
      type: string
      enum: [DRAFT, SUBMITTED, UNDER_REVIEW, INTERVIEW, VERIFICATION, APPROVED, REJECTED, SUSPENDED, HOLD]

    VettingProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
        headline: { type: string }
        bio: { type: string }
        years_experience: { type: integer }
        hourly_rate_min: { type: number }
        hourly_rate_max: { type: number }
        currency: { type: string }
        status: { $ref: '#/components/schemas/TutorStatus' }
        is_public: { type: boolean }
        ranking_score: { type: number }
        timezone: { type: string }
        accepts_online: { type: boolean }
        accepts_in_person: { type: boolean }
        verified_at: { type: string, format: date-time }
        approved_at: { type: string, format: date-time }
