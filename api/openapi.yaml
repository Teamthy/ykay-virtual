    put:
      tags: [admin]
      summary: Edit a session's name/dates (not allowed once CLOSED)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
