openapi: 3.0.3
info:
  title: YK-Virtual API
  version: 1.0.0
  description: |
    Full commercial, SEO-first, curriculum-governed tutoring marketplace and virtual school.
    Built to Tuteria-level parity + beyond (blog, B2B, referrals, escrow, vetting).
servers:
  - url: http://localhost:8080/api/v1
    description: Local
  - url: https://api.ykaycollege.com/api/v1
    description: Production

tags:
  - name: identity
  - name: tutors
  - name: subjects
  - name: programmes
  - name: cohorts
  - name: bookings
  - name: payments
  - name: messaging
  - name: reviews
  - name: content
  - name: institutions
  - name: referrals
  - name: learning
  - name: analytics

paths:
  /auth/me/onboarded:
    post:
      tags: [identity]
      summary: Complete the first-time wizard (idempotent onboarding flag)
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: "Onboarded flag set" }

  /me/recommendations:
    get:
      tags: [portal]
      summary: Session-scoped suggestions (cohorts, programmes, tutors ranked for the session's learners)
      description: |
        Suggestions engine: cohorts open for enrolment ordered by start date
        and fill rate, featured programmes level-matched to the learner, and
        top-ranked tutors. Includes a human-readable personalisation basis.
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: Recommendations }


# â”€â”€ contract-generated (G6.1): routed endpoints not previously documented â”€â”€
