    get:
      tags: []
      summary: "Routed endpoint (contract-generated â€” expand me)"
      security: [{ sessionCookie: [] }]
      responses:
        '200': { description: OK }

  /auth/register:
    post:
      tags: [identity]
      summary: Register a user (bcrypt password, role assignment, audit logged)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, roles]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                roles: { type: array, items: { type: string, enum: [STUDENT, PARENT, TUTOR] } }
                phone: { type: string }
                timezone: { type: string, default: Africa/Lagos }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '409': { description: Email already registered }

  /auth/login:
    post:
      tags: [identity]
      summary: >-
        Log in with email + password. Verifies bcrypt hash, creates a session
        and returns an httpOnly `ykv_session` cookie (raw token never leaves
        the cookie; only its SHA-256 hash is stored).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Logged in â€” sets httpOnly ykv_session cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401': { description: Invalid credentials }

  /auth/mfa/confirm:
    post:
      tags: [identity]
      summary: Complete an admin login with the emailed second factor (MFA)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, description: 6-digit emailed verification code }
      responses:
        '200':
          description: Session issued (admin login complete)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401': { description: Invalid or expired MFA code }

  /auth/logout:
    post:
      tags: [identity]
      summary: Revoke the session and clear the cookie (idempotent)
      responses:
        '200': { description: Logged out }

  /auth/me:
    get:
      tags: [identity]
      summary: Current user + roles from the session cookie
      responses:
        '200':
          description: Session user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        '401': { description: Not authenticated / session expired or revoked }

  /auth/verify-email/request:
    post:
      tags: [identity]
      summary: Send email verification link (never reveals account existence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Sent (or silently skipped when unknown/already verified) }

  /auth/verify-email/confirm:
    post:
      tags: [identity]
      summary: Confirm email with the single-use token from the emailed link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: Verified â€” account activated
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified: { type: boolean }
                  status: { type: string }
        '400': { description: Invalid or expired token }
        '409': { description: Token already used }

  /auth/password-reset/request:
    post:
      tags: [identity]
      summary: Email a password reset link (never reveals account existence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Sent (or silently skipped when unknown) }

  /auth/password-reset/confirm:
    post:
      tags: [identity]
      summary: Set a new password with the single-use token; rotates ALL sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200': { description: Password updated, sessions rotated }
        '400': { description: Invalid/expired token or weak password }
        '409': { description: Token already used }

  /subjects:
    get:
      tags: [subjects]
      summary: List subjects with caching (60-300s TTL, invalidate on write)
      parameters:
