openapi: 3.0.3
info:
  title: YKAY Virtual School API
  version: 1.0.0
  description: |
    Full commercial, SEO-first, curriculum-governed tutoring marketplace and virtual school.
    Built to Tuteria-level parity + beyond (blog, B2B, referrals, escrow, vetting).
servers:
  - url: http://localhost:8080/api/v1
    description: Local
  - url: https://api.ykay.com/api/v1
    description: Production

tags:
  - name: identity
  - name: tutors
  - name: subjects
  - name: programmes
  - name: cohorts
  - name: bookings
  - name: payments
  - name: messaging
  - name: reviews
  - name: content
  - name: institutions
  - name: referrals

paths:
  /auth/register:
    post:
      tags: [identity]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, roles]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                roles: { type: array, items: { type: string, enum: [STUDENT, PARENT, TUTOR] } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /auth/login:
    post:
      tags: [identity]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }

  /subjects:
    get:
      tags: [subjects]
      summary: List subjects with caching (60-300s TTL, invalidate on write)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, created_at] } }
      responses:
        '200':
          description: Subjects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubjects'

  /subjects/{slug}:
    get:
      tags: [subjects]
      summary: Get subject by slug (SSG+ISR)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Subject detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectDetail'

  /tutors/search:
    get:
      tags: [tutors]
      summary: Search tutors (Redis cached, p95 <300ms at 500 VU)
      parameters:
        - { name: subject, in: query, schema: { type: string } }
        - { name: location, in: query, schema: { type: string } }
        - { name: online, in: query, schema: { type: boolean } }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string, enum: [rating, ranking_score, price] } }
      responses:
        '200':
          description: Tutor list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTutors'

  /tutors/{slug}:
    get:
      tags: [tutors]
      summary: Tutor public profile (SSG+ISR, Person+AggregateRating JSON-LD)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Tutor profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorProfile'

  /programmes:
    get:
      tags: [programmes]
      summary: List programmes (filter by curriculum, level, exam, format)
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: curriculum, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [COHORT, PRIVATE, BOOTCAMP] } }
      responses:
        '200':
          description: Programmes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProgrammes'

  /cohorts:
    get:
      tags: [cohorts]
      summary: List cohorts
      parameters:
        - { name: programme_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Cohorts }

  /cohorts/{id}:
    get:
      tags: [cohorts]
      summary: Get cohort by id (checkout surface, cached 300s)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Cohort
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cohort'
        '404': { description: Cohort not found }

  /bookings:
    post:
      tags: [bookings]
      summary: >-
        Create booking (COHORT enrollment or PRIVATE package) — transactional,
        bounded pool, no N+1. Idempotent via idempotency_key: a repeated key
        returns the original order (replayed=true) with no duplicate charge.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, parent_user_id, student_id]
              properties:
                type: { type: string, enum: [PRIVATE, COHORT] }
                cohort_id: { type: string, format: uuid }
                subject_id: { type: string, format: uuid }
                tutor_profile_id: { type: string, format: uuid }
                parent_user_id: { type: string, format: uuid }
                student_id: { type: string, format: uuid }
                total_sessions: { type: integer, minimum: 1 }
                session_duration_minutes: { type: integer, minimum: 15 }
                price_per_session: { type: number, exclusiveMinimum: 0 }
                currency: { type: string, default: NGN }
                goals: { type: string }
                preferred_days: { type: string }
                preferred_time_range: { type: string }
                idempotency_key: { type: string, maxLength: 100 }
      responses:
        '201':
          description: Booking created (order PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResponse'
        '403': { description: Student not linked to parent / tutor cannot teach }
        '409': { description: Capacity full, duplicate enrollment, or order conflict }

  /payments/initiate:
    post:
      tags: [payments]
      summary: >-
        Initiate payment for a PENDING order. Creates the payment row with a
        unique provider_reference and returns the hosted checkout link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, provider, email]
              properties:
                order_id: { type: string, format: uuid }
                provider: { type: string, enum: [PAYSTACK, FLUTTERWAVE] }
                email: { type: string, format: email }
                callback_url: { type: string }
      responses:
        '201':
          description: Payment pending + checkout link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiatePaymentResponse'
        '409': { description: Order not PENDING }

  /payments/webhooks/{provider}:
    post:
      tags: [payments]
      summary: >-
        Idempotent webhook (UNIQUE provider_reference, HMAC signature verified
        server-side — the client redirect is never trusted). Duplicate
        deliveries return 200 with duplicate=true; signature failures 400.
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [PAYSTACK, FLUTTERWAVE] } }
        - { name: X-Paystack-Signature, in: header, schema: { type: string } }
        - { name: verif-hash, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed (idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookResult'
        '400': { description: Invalid signature / malformed payload / amount mismatch }

  /reviews:
    post:
      tags: [reviews]
      summary: Create review (consent-gated, booking-scoped)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReview'
      responses:
        '201': { description: Review pending moderation }

  /content/blog:
    get:
      tags: [content]
      summary: Blog posts (subject/exam-tagged, SSG+ISR, Article JSON-LD)
      parameters:
        - { name: subject, in: query, schema: { type: string } }
        - { name: exam, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200': { description: Blog list }

  /institutions:
    post:
      tags: [institutions]
      summary: Create B2B institution (for-schools, corporate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type: { type: string, enum: [SCHOOL, CORPORATE] }
      responses:
        '201': { description: Institution created }

components:
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        status: { type: string }
        timezone: { type: string }

    Subject:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        category: { type: string }

    SubjectDetail:
      allOf:
        - $ref: '#/components/schemas/Subject'
        - type: object
          properties:
            programmes: { type: array, items: { type: object } }
            tutors: { type: array, items: { $ref: '#/components/schemas/TutorProfile' } }
            related_content: { type: array, items: { type: object } }

    TutorProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
        bio: { type: string }
        rating_avg: { type: number }
        rating_count: { type: integer }
        ranking_score: { type: number }
        subjects: { type: array, items: { $ref: '#/components/schemas/Subject' } }

    PaginatedSubjects:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Subject' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PaginatedTutors:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/TutorProfile' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PaginatedProgrammes:
      type: object
      properties:
        data: { type: array, items: { type: object } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }
        has_next: { type: boolean }
        has_prev: { type: boolean }

    CreateReview:
      type: object
      required: [tutor_profile_id, rating, consent_given]
      properties:
        tutor_profile_id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        consent_given: { type: boolean }

    Cohort:
      type: object
      properties:
        id: { type: string, format: uuid }
        programme_id: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        tutor_profile_id: { type: string, format: uuid }
        capacity: { type: integer }
        enrolled_count: { type: integer }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        schedule_description: { type: string }
        timezone: { type: string }
        location_mode: { type: string, enum: [ONLINE, IN_PERSON, HYBRID] }
        fee: { type: number }
        currency: { type: string }
        status: { type: string }

    OrderItem:
      type: object
      properties:
        item_type: { type: string, enum: [COHORT, PRIVATE_PACKAGE, PRODUCT, FEE] }
        reference_id: { type: string, format: uuid }
        description: { type: string }
        quantity: { type: integer }
        total_price: { type: number }

    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_number: { type: string }
        status: { type: string, enum: [PENDING, PAID, FAILED, REFUNDED, CANCELLED] }
        subtotal: { type: number }
        discount_amount: { type: number }
        total_amount: { type: number }
        currency: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/OrderItem' } }

    BookingResponse:
      type: object
      properties:
        order: { $ref: '#/components/schemas/Order' }
        enrollment_id: { type: string, format: uuid }
        package_id: { type: string, format: uuid }
        replayed: { type: boolean }
        payment_required: { type: boolean }

    InitiatePaymentResponse:
      type: object
      properties:
        payment_id: { type: string, format: uuid }
        order_number: { type: string }
        provider: { type: string }
        provider_reference: { type: string }
        amount: { type: number }
        currency: { type: string }
        payment_link: { type: string }
        status: { type: string }

    WebhookResult:
      type: object
      properties:
        processed: { type: boolean }
        duplicate: { type: boolean }
        ignored: { type: boolean }
        reason: { type: string }
        payment_id: { type: string, format: uuid }
