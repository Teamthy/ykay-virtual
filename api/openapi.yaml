      responses:
        '201': { description: Session created (DRAFT) }
        '409': { description: Overlaps an open session in the same scope }
    get:
      tags: [admin]
      summary: List academic sessions for a scope (newest first)
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: institution_id, in: query, schema: { type: string, format: uuid }, description: Omit for the platform scope }
      responses:
        '200': { description: Sessions }

