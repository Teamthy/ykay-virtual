openapi: 3.0.3
info:
  title: YKAY Virtual School API
  version: 1.0.0
  description: |
    Full commercial, SEO-first, curriculum-governed tutoring marketplace and virtual school.
    Built to Tuteria-level parity + beyond (blog, B2B, referrals, escrow, vetting).
servers:
  - url: http://localhost:8080/api/v1
    description: Local
  - url: https://api.ykay.com/api/v1
    description: Production

tags:
  - name: identity
  - name: tutors
  - name: subjects
  - name: programmes
  - name: cohorts
  - name: bookings
  - name: payments
  - name: messaging
  - name: reviews
  - name: content
  - name: institutions
  - name: referrals

paths:
  /auth/register:
    post:
      tags: [identity]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, roles]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                roles: { type: array, items: { type: string, enum: [STUDENT, PARENT, TUTOR] } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /auth/login:
    post:
      tags: [identity]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user: { $ref: '#/components/schemas/User' }

  /subjects:
    get:
      tags: [subjects]
      summary: List subjects with caching (60-300s TTL, invalidate on write)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
        - { name: search, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [name, -name, created_at] } }
      responses:
        '200':
          description: Subjects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubjects'

  /subjects/{slug}:
    get:
      tags: [subjects]
      summary: Get subject by slug (SSG+ISR)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Subject detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectDetail'

  /tutors/search:
    get:
      tags: [tutors]
      summary: Search tutors (Redis cached, p95 <300ms at 500 VU)
      parameters:
        - { name: subject, in: query, schema: { type: string } }
        - { name: location, in: query, schema: { type: string } }
        - { name: online, in: query, schema: { type: boolean } }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: page_size, in: query, schema: { type: integer } }
        - { name: sort, in: query, schema: { type: string, enum: [rating, ranking_score, price] } }
      responses:
        '200':
          description: Tutor list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTutors'

  /tutors/{slug}:
    get:
      tags: [tutors]
      summary: Tutor public profile (SSG+ISR, Person+AggregateRating JSON-LD)
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Tutor profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TutorProfile'

  /programmes:
    get:
      tags: [programmes]
      summary: List programmes (filter by curriculum, level, exam, format)
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: curriculum, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { type: string, enum: [COHORT, PRIVATE, BOOTCAMP] } }
      responses:
        '200':
          description: Programmes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProgrammes'

  /cohorts:
    get:
      tags: [cohorts]
      summary: List cohorts
      parameters:
        - { name: programme_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Cohorts }

  /bookings:
    post:
      tags: [bookings]
      summary: Create booking (private tuition request or cohort enrollment) — transactional, bounded pool, no N+1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { type: string, enum: [PRIVATE, COHORT] }
                subject_id: { type: string, format: uuid }
                student_id: { type: string, format: uuid }
      responses:
        '201': { description: Booking created }

  /payments/webhooks/{provider}:
    post:
      tags: [payments]
      summary: Idempotent webhook (unique provider_reference, signature-verified)
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [PAYSTACK, FLUTTERWAVE, STRIPE] } }
        - { name: X-Paystack-Signature, in: header, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200': { description: Webhook processed (idempotent) }

  /reviews:
    post:
      tags: [reviews]
      summary: Create review (consent-gated, booking-scoped)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReview'
      responses:
        '201': { description: Review pending moderation }

  /content/blog:
    get:
      tags: [content]
      summary: Blog posts (subject/exam-tagged, SSG+ISR, Article JSON-LD)
      parameters:
        - { name: subject, in: query, schema: { type: string } }
        - { name: exam, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200': { description: Blog list }

  /institutions:
    post:
      tags: [institutions]
      summary: Create B2B institution (for-schools, corporate)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                type: { type: string, enum: [SCHOOL, CORPORATE] }
      responses:
        '201': { description: Institution created }

components:
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        status: { type: string }
        timezone: { type: string }

    Subject:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        category: { type: string }

    SubjectDetail:
      allOf:
        - $ref: '#/components/schemas/Subject'
        - type: object
          properties:
            programmes: { type: array, items: { type: object } }
            tutors: { type: array, items: { $ref: '#/components/schemas/TutorProfile' } }
            related_content: { type: array, items: { type: object } }

    TutorProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        display_name: { type: string }
        bio: { type: string }
        rating_avg: { type: number }
        rating_count: { type: integer }
        ranking_score: { type: number }
        subjects: { type: array, items: { $ref: '#/components/schemas/Subject' } }

    PaginatedSubjects:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Subject' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PaginatedTutors:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/TutorProfile' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PaginatedProgrammes:
      type: object
      properties:
        data: { type: array, items: { type: object } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total_items: { type: integer }
        total_pages: { type: integer }
        has_next: { type: boolean }
        has_prev: { type: boolean }

    CreateReview:
      type: object
      required: [tutor_profile_id, rating, consent_given]
      properties:
        tutor_profile_id: { type: string, format: uuid }
        booking_id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }
        consent_given: { type: boolean }
