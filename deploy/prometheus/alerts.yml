# YK-Virtual — Prometheus alerting rules (G3.3).
#
# Severities: "page" = wake someone (SLO broken or money/access at risk),
# "ticket" = triage next working slot. Every alert has a runbook reference:
# docs/OPS_MONITORING.md (diagnosis) and docs/DR_RUNBOOK.md (restore drills).
groups:
  - name: yk-virtual-availability
    rules:
      - alert: YK-VirtualApiDown
        expr: up{job="yk-virtual-api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "YK-Virtual API unreachable for 2 minutes"
          description: "Prometheus cannot scrape {{ $labels.instance }}. Check docker compose ps, api logs and the proxy in front of web:3000."
          runbook: "docs/OPS_MONITORING.md#api-down"

      - alert: YK-VirtualHigh5xxRate
        expr: |
          sum(rate(ykv_http_requests_total{code=~"5.."}[5m]))
            / clamp_min(sum(rate(ykv_http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: page
        annotations:
          summary: ">5% of API requests are 5xx ({{ $value | humanizePercentage }})"
          description: "Sustained server errors. Correlate with deploys, DB/Redis health and the recover middleware logs."
          runbook: "docs/OPS_MONITORING.md#high-5xx"

      - alert: YK-VirtualHighLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(ykv_http_request_duration_seconds_bucket[10m])) by (le)) > 1
        for: 10m
        labels:
          severity: ticket
        annotations:
          summary: "API p95 latency above 1s for 10 minutes"
          description: "p95 = {{ $value }}s. Check DB slow queries, Redis latency and OTel traces (Tempo) for the slowest routes."
          runbook: "docs/OPS_MONITORING.md#high-latency"

      - alert: YK-VirtualRedisDown
        expr: ykv_redis_connected == 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Redis unreachable — API degraded to in-memory fallback"
          description: "Rate limiting, session caching and the job queue have silently degraded to per-instance/direct behaviour. Restore Redis and verify the queue drained."
          runbook: "docs/OPS_MONITORING.md#redis-down"

      - alert: YK-VirtualMeetingProviderStub
        expr: ykv_meeting_provider_stub == 1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Meeting provider resolved to the dev stub (fake meet.ykvirtual.local URLs)"
          description: "Live classroom links are fake. Set MEETING_PROVIDER=whereby and a valid WHEREBY_API_KEY."
          runbook: "docs/OPS_MONITORING.md#meeting-stub"

  - name: yk-virtual-jobs
    rules:
      - alert: YK-VirtualQueueBacklog
        expr: ykv_queue_depth{state="ready"} > 100
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Job queue backlog: {{ $value }} ready jobs on backend {{ $labels.backend }}"
          description: 'Workers are not keeping up (or the worker service is down — check up{job="yk-virtual-worker"}).'
          runbook: "docs/OPS_MONITORING.md#queue-backlog"

      - alert: YK-VirtualDeadLetterBuildup
        expr: ykv_queue_depth{state="dead"} > 10
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} jobs dead-lettered on backend {{ $labels.backend }}"
          description: "Jobs exhausted retries. Inspect with queue DeadLetters and replay/fix the handler before data drift (payouts, reminders)."
          runbook: "docs/OPS_MONITORING.md#dead-letters"

      - alert: YK-VirtualJobErrorSpike
        expr: sum(rate(ykv_jobs_retried_total[15m])) > 0.1
        for: 15m
        labels:
          severity: ticket
        annotations:
          summary: "Elevated job retry rate ({{ $value }}/s)"
          description: "Transient provider errors usually — but sustained retries mean a broken integration (email/SMS/payouts)."
          runbook: "docs/OPS_MONITORING.md#job-errors"

  - name: yk-virtual-crons
    rules:
      # expire_stale_booking_holds runs every 15m → stale after 2h.
      - alert: YK-VirtualCronStale_Holds
        expr: time() - ykv_worker_cron_last_success_timestamp{cron="expire_stale_booking_holds"} > 7200
        for: 15m
        labels:
          severity: page
        annotations:
          summary: "Booking-hold expiry cron has not succeeded for over 2 hours"
          description: "Stale escrow holds stop being released — bookings and tutor capacity will drift."
          runbook: "docs/OPS_MONITORING.md#stale-cron"

      # process_weekly_tutor_payouts runs every 7d → stale after 8d.
      - alert: YK-VirtualCronStale_Payouts
        expr: time() - ykv_worker_cron_last_success_timestamp{cron="process_weekly_tutor_payouts"} > 691200
        for: 1h
        labels:
          severity: page
        annotations:
          summary: "Tutor payout cron has not succeeded for over 8 days"
          description: "Tutors are not being paid. Do not run payouts manually without checking each payout's ledger state first."
          runbook: "docs/OPS_MONITORING.md#stale-cron"

      # compute_tutor_ranking_score runs every 24h → stale after 30h.
      - alert: YK-VirtualCronStale_Ranking
        expr: time() - ykv_worker_cron_last_success_timestamp{cron="compute_tutor_ranking_score"} > 108000
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "Tutor ranking recompute has not succeeded for over 30 hours"
          description: "Search ordering drifts until the next successful run."
          runbook: "docs/OPS_MONITORING.md#stale-cron"

  - name: yk-virtual-data-protection
    rules:
      - alert: YK-VirtualBackupStale
        expr: |
          (time() - ykv_backup_last_success_timestamp > 93600) or
          (ykv_backup_last_success_timestamp == 0)
        for: 30m
        labels:
          severity: page
        annotations:
          summary: "No successful database backup for over 26 hours"
          description: "RPO is at risk (target ≤24h). Check the backup service logs and scripts/backup.sh output, then run the DR drill."
          runbook: "docs/DR_RUNBOOK.md#backup-failure"

      - alert: YK-VirtualDrillOverdue
        expr: |
          (time() - ykv_dr_drill_last_success_timestamp > 691200) or
          (ykv_dr_drill_last_success_timestamp == 0)
        for: 1h
        labels:
          severity: ticket
        annotations:
          summary: "No successful restore drill for over 8 days"
          description: "Weekly drill required (docs/DR_RUNBOOK.md). Untested backups are not backups."
          runbook: "docs/DR_RUNBOOK.md#drill-schedule"
