# YK-Virtual — production compose stack (Phase 40) with observability stack
# (Prometheus + Grafana + node-exporter, G3.3) and a durable worker service
# (G3.1).
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Secrets: put real values in .env.production (gitignored) and reference
# ${VAR} below; the API refuses to start with dev defaults in production
# (config.Validate). A reverse proxy (Caddy/Traefik/Nginx) in front of
# `web:3000` terminates TLS and forwards /api/v1 via the web container's
# rewrite — the browser only ever talks to the web origin.

name: yk-virtual-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ykvirtual}
      POSTGRES_USER: ${POSTGRES_USER:-ykvirtual}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ykvirtual} -d ${POSTGRES_DB:-ykvirtual}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports exposed to the host — only reachable inside the network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    # Upload malware scanning (gap #5): the API's upload guard fails closed
    # when the scanner is unreachable, so this service is required for
    # uploads to work in the compose stack.
    image: clamav/clamav:stable_base
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck"] # upstream helper: exits 0 when clamd is ready
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["migrate", "--cmd=up"]
    environment: &api_env
      ENVIRONMENT: production
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-ykvirtual}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ykvirtual}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SITE_URL: ${SITE_URL:?set SITE_URL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      PAYSTACK_SECRET: ${PAYSTACK_SECRET:-}
      FLUTTERWAVE_SECRET: ${FLUTTERWAVE_SECRET:-}
      CLAMAV_ADDR: clamav:3310
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${SITE_URL}/auth/google/callback
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CHATBOT_ENABLED: ${CHATBOT_ENABLED:-true}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@ykaycollege.com}
      TERMII_API_KEY: ${TERMII_API_KEY:-}
      TERMII_SENDER_ID: ${TERMII_SENDER_ID:-}
      TERMII_FROM: ${TERMII_FROM:-}
      # V-004: the API fatal-exits in production when the meeting provider
      # resolves to the stub, so a silent default of "stub" just moves the
      # outage to first boot. Require the operator to set a real provider.
      MEETING_PROVIDER: ${MEETING_PROVIDER:?set MEETING_PROVIDER (jitsi or whereby)}
      WHEREBY_API_KEY: ${WHEREBY_API_KEY:-}
      AI_MAX_TOKENS_PER_REQUEST: ${AI_MAX_TOKENS_PER_REQUEST:-1024}
      AI_DAILY_BUDGET_TOKENS: ${AI_DAILY_BUDGET_TOKENS:-200000}
      STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:-10485760}
      STORAGE_ALLOWED_MIME: ${STORAGE_ALLOWED_MIME:-}
      S3_QUARANTINE_BUCKET: ${S3_QUARANTINE_BUCKET:-yk-virtual-quarantine}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-yk-virtual-public}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-yk-virtual-private}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *api_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Scale out: docker compose up -d --scale api=2 (stateless except the
    # in-memory rate limiter — pin to 1 or add Redis-backed limiting).

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/worker"]
    restart: unless-stopped
    environment: *api_env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Consumes the durable Redis queue (G3.1) + runs crons; exposes cron
    # heartbeats and queue depths on :8081 for Prometheus (G3.3).

  web:
    build:
      context: ./client
      args:
        API_PROXY_TARGET: http://api:8080
    restart: unless-stopped
    environment:
      # Browser fetches are same-origin via the rewrite; these feed SSR.
      NEXT_PUBLIC_API_URL: ${SITE_URL}/api/v1
      NEXT_PUBLIC_SITE_URL: ${SITE_URL}
      API_PROXY_TARGET: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000" # bind locally; proxy TLS in front
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: >
      /bin/sh -c '
      while true; do
        ts=$$(date -u +%Y%m%dT%H%M%SZ);
        out=/backups/yk-virtual-$$ts.dump;
        if pg_dump -h postgres -U ${POSTGRES_USER:-ykvirtual} -d ${POSTGRES_DB:-ykvirtual} -Fc > $$out; then
          printf "ykv_backup_last_success_timestamp %s\nykv_backup_size_bytes %s\n" \
            "$$(date +%s)" "$$(stat -c%s $$out)" > /metrics-textfile/ykv_backup.prom;
        else
          printf "ykv_backup_last_failure_timestamp %s\n" "$$(date +%s)" > /metrics-textfile/ykv_backup.prom.fail;
        fi;
        find /backups -name "yk-virtual-*.dump" -mtime +${BACKUP_RETENTION_DAYS:-14} -delete;
        sleep ${BACKUP_INTERVAL_HOURS:-24}h;
      done'
    volumes:
      - postgres_data:/var/lib/postgresql/data:ro
      - ./backups:/backups
      - ./metrics-textfile:/metrics-textfile

  # ── Observability (G3.3) ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090" # local only; put auth/ingress in front if exposed

  grafana:
    image: grafana/grafana:11.1.4
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000" # local only; proxy in front for remote access
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:v1.8.2
    restart: unless-stopped
    command:
      - "--collector.textfile.directory=/textfile"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
    volumes:
      - ./metrics-textfile:/textfile:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

volumes:
  postgres_data:
  clamav_data:
  redis_data:
  prometheus_data:
  grafana_data:
