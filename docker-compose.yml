version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: nuvora-postgres
    environment:
      POSTGRES_DB: nuvora
      POSTGRES_USER: nuvora
      POSTGRES_PASSWORD: nuvora
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: nuvora-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
