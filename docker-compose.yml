services:
  postgres:
    image: postgres:16
    container_name: yk-virtual-postgres
    environment:
      POSTGRES_DB: ykvirtual
      POSTGRES_USER: ykvirtual
      POSTGRES_PASSWORD: ykvirtual
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: yk-virtual-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
