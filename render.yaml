# Render Blueprint (phase 42, expanded for the Vercel + Render split) —
# one-click setup of the YK-Virtual production backend:
#   yk-virtual-api      Docker API (migrations run at boot via readyCheck gate)
#   yk-virtual-worker   Docker worker (Redis-backed dispatch queue — outbound
#                   email is routed through it in production)
#   yk-virtual-redis    Redis 7 (rate limiting, session cache, catalogue cache,
#                   job queue)
#   yk-virtual-db       PostgreSQL (managed)
#
#   https://dashboard.render.com/blueprints → "New Blueprint Instance" →
#   this file.
#
# Notes:
#   - The free Postgres plan EXPIRES after 30 days. Use `starter` ($7/mo)
#     for anything persistent, or accept re-seeding for a short demo.
#   - Free web services sleep after 15 min idle → first request after
#     sleep takes ~30–60s. Keep warm with UptimeRobot, or use `starter`.
#   - Values marked sync:false are secrets you set ONCE in the dashboard
#     (Render won't overwrite them on redeploy).

services:
  - type: web
    name: yk-virtual-api
    runtime: docker
    repo: https://github.com/Teamthy/ykay-virtual
    plan: free # or: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "8080"
      # ── Public surface ────────────────────────────────────────────────
      # SITE_URL is the WEB origin (the Vercel app, e.g. https://ykvirtual.vercel.app):
      # it drives the session-cookie Domain and the links inside emails.
      - key: SITE_URL
        sync: false
      # CORS allowlist: the web origin (+ the API's own host). Comma-separated.
      - key: ALLOWED_ORIGINS
        sync: false
      # Session-cookie domain: shared parent domain so the cookie reaches the
      # web origin through the proxy (e.g. ".vercel.app" or "virtual.ykaycollege.com").
      # Empty = host-only cookie. Required for Vercel(frontend)+Render(API).
      - key: COOKIE_DOMAIN
        sync: false
      # ── Data ───────────────────────────────────────────────────────────
      # Postgres lives on Oracle Cloud Always Free (DEPLOY-PRODUCTION.md).
      # Set once in the dashboard; sync:false so redeploys never overwrite it.
      # postgresql://ykvirtual:<password>@<oci-public-ip>:5432/ykvirtual?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: yk-virtual-redis
          type: redis
          property: connectionString
      # ── Rate limiting ──────────────────────────────────────────────────
      # TRUST_PROXY: Render sits in front of the API. Without this, every
      # request's RemoteAddr is Render's proxy IP, so ALL users share one
      # rate-limit bucket and shared-IP logins (households/schools/NAT) get
      # mass 429s. With it, the limiter reads X-Forwarded-For for the real
      # client IP (see internal/middleware clientIP).
      - key: TRUST_PROXY
        value: "true"
      # Global per-IP window raised for production (default now 1200/min).
      # Explicit here so a deployed instance never silently falls back to the
      # old 300/min default under legitimate concurrent bursts.
      - key: RATE_LIMIT_PER_MINUTE
        value: "1200"
      # Auth endpoints: 240/min per CLIENT IP. Several users behind one shared
      # IP (a school lab, an office) can sign in together without tripping the
      # limiter, while still throttling credential stuffing.
      - key: AUTH_RATE_LIMIT_PER_MINUTE
        value: "20"
      # ── Migrations ─────────────────────────────────────────────────────
      # "true" on the FIRST deploy applies the embedded migration chain at
      # boot (fresh database). Set to "false" afterwards — concurrent boots
      # on scaled replicas must not race schema_migrations.
      - key: MIGRATE_ON_BOOT
        value: "true"
      # ── Payments — START WITH TEST KEYS (staging gate G4.1) ───────────
      - key: PAYMENT_PROVIDER
        value: PAYSTACK
      - key: PAYSTACK_SECRET
        sync: false
      - key: PAYSTACK_TRANSFER_ENABLED
        value: "false"
      - key: FLUTTERWAVE_SECRET
        sync: false
      # ── Email (magic-link codes, verification, receipts) ───────────────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false # e.g. YK-Virtual <no-reply@yourdomain.com>
      # Recommended: Resend REST API (no SMTP relay needed) — one key from
      # resend.com. When set, it takes precedence over SMTP.
      - key: RESEND_API_KEY
        sync: false
      # Named operators — set in the dashboard (never commit the password).
      # On boot the API upserts these as ACTIVE + verified. MFA still required.
      - key: OPERATOR_ACADEMIC_EMAIL
        sync: false
      - key: OPERATOR_SUPER_EMAIL
        sync: false
      - key: OPERATOR_PASSWORD
        sync: false
      # ── SMS (Termii) ───────────────────────────────────────────────────
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_WHATSAPP_SENDER
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      - key: TERMII_SENDER_ID
        value: YK-Virtual
      # ── Meetings (Whereby) ─────────────────────────────────────────────
      - key: MEETING_PROVIDER
        value: jitsi # free meet.jit.si; switch to whereby when you have a key
      - key: WHEREBY_API_KEY
        sync: false
      # ── OAuth (optional — Google sign-in) ──────────────────────────────
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URL
        sync: false # https://<web origin>/auth/google/callback
      # ── AI assistant ───────────────────────────────────────────────────
      - key: CHATBOT_ENABLED
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      # ── Mobile push (Expo) ─────────────────────────────────────────────
      - key: EXPO_ACCESS_TOKEN
        sync: false
      # ── Observability ──────────────────────────────────────────────────
      - key: METRICS_TOKEN
        sync: false # bearer required to scrape /metrics

  - type: web
    name: yk-virtual-worker
    runtime: docker
    repo: https://github.com/Teamthy/ykay-virtual
    plan: free # or: starter
    dockerfilePath: ./Dockerfile
    # Render supports `dockerCommand` for Docker runtimes. If your account
    # rejects it, create the worker manually: Dockerfile image + command
    # "/usr/local/bin/worker".
    dockerCommand: /usr/local/bin/worker
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      # Postgres lives on Oracle Cloud Always Free (DEPLOY-PRODUCTION.md).
      # Set once in the dashboard; sync:false so redeploys never overwrite it.
      # postgresql://ykvirtual:<password>@<oci-public-ip>:5432/ykvirtual?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: yk-virtual-redis
          type: redis
          property: connectionString
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_WHATSAPP_SENDER
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: SITE_URL
        sync: false

  - type: redis
    name: yk-virtual-redis
    plan: free
    ipAllowList: [] # Render-internal only

# NOTE: no Render-managed database — production runs Postgres on Oracle
# Cloud Always Free (A1 VM). See DEPLOY-PRODUCTION.md at the workspace root.
# If you ever want Render Postgres instead, re-add:
# databases:
#   - name: yk-virtual-db
#     plan: starter
